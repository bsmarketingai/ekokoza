<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .ek-pb { transition: box-shadow .25s; }
  .ek-pb:hover { box-shadow: 0 18px 36px -22px rgba(30,24,18,.6); }
  .ek-pb:hover .ek-pb-img { transform: scale(1.04); }
  .ek-pb-cta:hover { background: #EDE4D0 !important; border-color: #EDE4D0 !important; }
  @media (max-width: 549px) { .ek-pb-in { padding: 18px 16px 18px !important; } .ek-pb-t { font-size: 22px !important; } }
</style>
</helmet>
<a href="{{ href }}" class="ek-pb" style="position:relative; display:flex; flex-direction:column; justify-content:flex-end; height:100%; min-height:440px; border-radius:14px; overflow:hidden; text-decoration:none; background:#3A2F22; font-family:'Work Sans',sans-serif;">
  <span class="ek-pb-img" style="{{ imgStyle }}"></span>
  <span aria-hidden="true" style="position:absolute; inset:0; background:linear-gradient(180deg,rgba(30,24,18,0) 0%,rgba(30,24,18,0) 38%,rgba(30,24,18,.55) 62%,rgba(26,20,14,.9) 100%);"></span>
  <span style="position:absolute; top:12px; left:12px; z-index:2; background:#F6F1E7; color:#4C653D; font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:999px; letter-spacing:.04em;">{{ kicker }}</span>
  <span class="ek-pb-in" style="position:relative; z-index:1; display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:22px 20px 22px;">
    <span class="ek-pb-t" style="font-family:'EB Garamond',serif; font-weight:500; font-size:25px; line-height:1.15; color:#F6F1E7; text-wrap:pretty;">{{ title }}</span>
    <span style="font-size:14.5px; line-height:1.55; color:#EDE6D5; text-wrap:pretty;">{{ desc }}</span>
    <span class="ek-pb-cta" style="display:inline-flex; align-items:center; gap:8px; margin-top:6px; background:#F6F1E7; color:#4C653D; border:1.5px solid #F6F1E7; padding:11px 20px; border-radius:999px; font-weight:600; font-size:14.5px; transition:background .2s, border-color .2s;">{{ cta }}<span style="{{ iconArrow }}"></span></span>
  </span>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:520},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Recepty&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Vlastní parfém z přírodních silic&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;desc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Jak poskládat hlavu, srdce a základ vůně a kolik silic přidat. Recept krok za krokem, i pro začátečníky.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Zobrazit recept&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;recept.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/banners/parfemy.png&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;imgPosition&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;center 40%&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const img = this.props.img ?? 'assets/banners/parfemy.png';
    const pos = this.props.imgPosition ?? 'center 40%';
    const arrow = 'assets/icons/arrow-right-02.svg';
    return {
      href: this.props.href ?? 'recept.dc.html',
      kicker: this.props.kicker ?? 'Recepty',
      title: this.props.title ?? 'Vlastní parfém z přírodních silic',
      desc: this.props.desc ?? 'Jak poskládat hlavu, srdce a základ vůně a kolik silic přidat. Recept krok za krokem, i pro začátečníky.',
      cta: this.props.cta ?? 'Zobrazit recept',
      imgStyle: 'position:absolute; inset:0; display:block; background:' + pos + ' / cover no-repeat url("' + img + '"); transition:transform .6s ease;',
      iconArrow: 'display:inline-block; width:16px; height:16px; flex:0 0 auto; background-color:#4C653D; -webkit-mask:url("' + arrow + '") center / contain no-repeat; mask:url("' + arrow + '") center / contain no-repeat;',
    };
  }
}
</script>
</body>
</html>
