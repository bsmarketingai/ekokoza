<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a href="{{ href }}" class="ek-card" style="display:flex; flex-direction:column; background:#fff; border:1px solid #ECE3D2; border-radius:14px; overflow:hidden; text-decoration:none; color:#2A2A24; transition:transform .25s, box-shadow .25s; font-family:'Work Sans',sans-serif;">
  <div style="position:relative; aspect-ratio:4/3;">
    <div style="{{ imgStyle }}"></div>
    <sc-if value="{{ category }}" hint-placeholder-val="{{ true }}">
      <span style="position:absolute; top:12px; left:12px; background:#F6F1E7; color:#4C653D; font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:999px;">{{ category }}</span>
    </sc-if>
  </div>
  <div style="padding:18px; display:flex; flex-direction:column; gap:10px; flex:1;">
    <h3 style="margin:0; font-family:'EB Garamond',serif; font-weight:500; font-size:18px; line-height:1.25; color:#2A2A24;">{{ title }}</h3>
    <sc-if value="{{ desc }}" hint-placeholder-val="{{ true }}">
      <p style="margin:0; font-size:13.5px; line-height:1.45; color:#6B6B5E;">{{ desc }}</p>
    </sc-if>
    <dc-import name="ui-Rating" value="{{ rating }}" count="{{ ratingCount }}" size="{{ 14 }}" hint-size="150px,20px"></dc-import>
    <div style="display:flex; flex-wrap:wrap; gap:6px 16px; color:#6B6B5E; font-size:13.5px;">
      <span style="display:inline-flex; align-items:center; gap:6px; white-space:nowrap;"><span style="{{ iconLevel }}"></span>{{ level }}</span>
      <span style="display:inline-flex; align-items:center; gap:6px; white-space:nowrap;"><span style="{{ iconClock }}"></span>{{ time }}</span>
    </div>
    <span class="ek-btn-secondary" style="margin-top:auto; align-self:flex-start; display:inline-flex; align-items:center; gap:8px; border:1.5px solid #4C653D; color:#4C653D; padding:9px 18px; border-radius:999px; font-weight:600; font-size:14px; transition:background .2s, color .2s;">{{ cta }}<span style="{{ iconArrow }}"></span></span>
  </div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:430},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Krém na paty a ztvrdlá místa&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;desc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Vyživující krém, který změkčí ztvrdlou kůži za pár dní.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;category&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Kosmetika&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;level&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Začátečník&quot;,&quot;Pokročilý&quot;,&quot;Zkušený&quot;],&quot;default&quot;:&quot;Začátečník&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;30 min&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;rating&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:4.8,&quot;min&quot;:0,&quot;max&quot;:5,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;},&quot;ratingCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:34,&quot;min&quot;:0,&quot;max&quot;:9999,&quot;tsType&quot;:&quot;number&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Zobrazit recept&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/recipes/krem-na-paty-a-ztvrdla-mista.jpg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  // Hugeicons only — renders an icon from assets/icons as a CSS mask so it
  // inherits currentColor. Path resolves whether previewed standalone or imported.
  hi(name, size) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    const s = size || 16;
    return `display:inline-block; width:${s}px; height:${s}px; flex:0 0 auto; background-color:currentColor; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`;
  }
  renderVals() {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const img = this.props.img ?? 'assets/recipes/krem-na-paty-a-ztvrdla-mista.jpg';
    const imgUrl = /^(https?:|\/|\.\.)/.test(img) ? img : base + img;
    const level = this.props.level ?? 'Začátečník';
    const levelIcons = { 'Začátečník': 'low-signal', 'Pokročilý': 'medium-signal', 'Zkušený': 'full-signal' };
    return {
      title: this.props.title ?? 'Krém na paty a ztvrdlá místa',
      desc: this.props.desc ?? 'Vyživující krém, který změkčí ztvrdlou kůži za pár dní.',
      category: this.props.category ?? 'Kosmetika',
      level,
      time: this.props.time ?? '30 min',
      rating: Number(this.props.rating ?? 4.8),
      ratingCount: Number(this.props.ratingCount ?? 34),
      cta: this.props.cta ?? 'Zobrazit recept',
      href: this.props.href ?? '#',
      imgStyle: 'position:absolute; inset:0; background:#EFE7D6 center/cover no-repeat; background-image:url("' + imgUrl + '");',
      iconLevel: this.hi(levelIcons[level] || 'no-signal', 16),
      iconClock: this.hi('clock-01', 16),
      iconArrow: this.hi('arrow-right-02', 16),
    };
  }
}
</script>
</body>
</html>
