<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a href="{{ href }}" class="ek-card" style="display:flex; flex-direction:column; background:#fff; border:1px solid #ECE3D2; border-radius:14px; overflow:hidden; text-decoration:none; color:#2A2A24; transition:transform .25s, box-shadow .25s; font-family:'Work Sans',sans-serif;">
  <div style="position:relative; aspect-ratio:4/3;">
    <div style="{{ imgStyle }}"></div>
    <sc-if value="{{ category }}" hint-placeholder-val="{{ true }}">
      <span style="position:absolute; top:12px; left:12px; background:#F6F1E7; color:#4C653D; font-size:11.5px; font-weight:600; padding:5px 11px; border-radius:999px;">{{ category }}</span>
    </sc-if>
    <sc-if value="{{ typeLabel }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute; top:12px; right:56px; background:rgba(255,253,246,.94); color:#4F6E2A; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; padding:5px 10px; border-radius:999px;">{{ typeLabel }}</span>
    </sc-if>
    <button onClick="{{ toggleFav }}" class="{{ favClass }}" title="{{ favTitle }}" aria-label="{{ favTitle }}" style="{{ favStyle }}"><span style="{{ favIcon }}"></span></button>
  </div>
  <div style="padding:18px; display:flex; flex-direction:column; gap:10px; flex:1;">
    <h3 style="margin:0; font-family:'EB Garamond',serif; font-weight:500; font-size:18px; line-height:1.25; color:#2A2A24;">{{ title }}</h3>
    <sc-if value="{{ desc }}" hint-placeholder-val="{{ true }}">
      <p style="margin:0; font-size:13.5px; line-height:1.45; color:#6B6B5E;">{{ desc }}</p>
    </sc-if>
    <dc-import name="ui-Rating" compact="{{ true }}" value="{{ rating }}" count="{{ ratingCount }}" size="{{ 14 }}" hint-size="150px,20px"></dc-import>
    <div style="display:flex; flex-wrap:wrap; gap:6px 16px; color:#6B6B5E; font-size:13.5px;">
      <sc-if value="{{ isRecipe }}" hint-placeholder-val="{{ true }}">
        <span style="display:inline-flex; align-items:center; gap:6px; white-space:nowrap;"><span style="{{ iconLevel }}"></span>{{ level }}</span>
      </sc-if>
      <span style="display:inline-flex; align-items:center; gap:6px; white-space:nowrap;"><span style="{{ iconClock }}"></span>{{ time }}</span>
    </div>
    <sc-if value="{{ hasIng }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; flex-wrap:wrap; gap:6px;">
        <sc-for list="{{ ingChips }}" as="i" hint-placeholder-count="3">
          <sc-if value="{{ i.ok }}" hint-placeholder-val="{{ true }}">
            <span style="display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; background:#F4F7EA; border:1px solid #E2EACF; font-size:12px; font-weight:600; color:#4C653D;">{{ i.label }}</span>
          </sc-if>
          <sc-if value="{{ i.miss }}" hint-placeholder-val="{{ false }}">
            <span style="display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px; background:#FBF1EA; border:1px dashed #E2B79E; font-size:12px; font-weight:600; color:#B23803;">{{ i.label }}</span>
          </sc-if>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ coverage }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding-top:2px;">
        <span style="{{ coverStyle }}"><span style="{{ coverIcon }}"></span>{{ coverage }}</span>
        <sc-if value="{{ canAdd }}" hint-placeholder-val="{{ false }}">
          <span role="button" onClick="{{ addMissing }}" class="ek-rc-add" style="display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:#4C653D; cursor:pointer; transition:color .2s;"><span style="{{ iconCart }}"></span>Doplnit do košíku</span>
        </sc-if>
      </div>
    </sc-if>
    <span class="ek-btn-secondary" style="margin-top:auto; align-self:flex-start; display:inline-flex; align-items:center; gap:8px; border:1.5px solid #4C653D; color:#4C653D; padding:9px 18px; border-radius:999px; font-weight:600; font-size:14px; transition:background .2s, color .2s;">{{ cta }}<span style="{{ iconArrow }}"></span></span>
  </div>
</a>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:470},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Krém na paty a ztvrdlá místa&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;desc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Vyživující krém, který změkčí ztvrdlou kůži za pár dní.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;category&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Kosmetika&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;type&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;level&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Začátečník&quot;,&quot;Pokročilý&quot;,&quot;Zkušený&quot;],&quot;default&quot;:&quot;Začátečník&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;time&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;30 min&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;rating&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:4.8,&quot;min&quot;:0,&quot;max&quot;:5,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;},&quot;ratingCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:34,&quot;min&quot;:0,&quot;max&quot;:9999,&quot;tsType&quot;:&quot;number&quot;},&quot;fav&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;coverage&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;complete&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/recipes/krem-na-paty.jpg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ingredients&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;missing&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;onAddMissing&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(m:string[])=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { fav: null };

  favStore() {
    if (!window.__ekFavRecipes) window.__ekFavRecipes = new Set();
    return window.__ekFavRecipes;
  }

  componentDidMount() {
    const id = this.props.title ?? '';
    if (this.props.fav) this.favStore().add(id);
    if (this.favStore().has(id)) this.setState({ fav: true });
  }

  hi(name, size, color) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    const s = size || 16;
    return `display:inline-block; width:${s}px; height:${s}px; flex:0 0 auto; background-color:${color || 'currentColor'}; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`;
  }
  renderVals() {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const img = this.props.img ?? 'assets/recipes/krem-na-paty.jpg';
    const imgUrl = /^(https?:|\/|\.\.)/.test(img) ? img : base + img;
    const level = this.props.level ?? 'Začátečník';
    const levelIcons = { 'Začátečník': 'low-signal', 'Pokročilý': 'medium-signal', 'Zkušený': 'full-signal' };
    const type = this.props.type ?? 'Recept';
    const isRecipe = type !== 'Článek';
    const ing = this.props.ingredients ?? [];
    const missing = this.props.missing ?? [];
    const coverage = this.props.coverage ?? '';
    const complete = !!this.props.complete;
    const shown = ing.slice(0, 4).map(n => ({ label: n, miss: missing.indexOf(n) > -1, ok: missing.indexOf(n) === -1 }));
    if (ing.length > 4) shown.push({ label: '+' + (ing.length - 4), miss: false, ok: true });
    const fav = this.state.fav !== null ? this.state.fav : !!this.props.fav;
    return {
      favClass: 'ek-fav' + (fav ? ' is-on' : ''),
      favTitle: fav ? 'Odebrat z oblíbených' : 'Přidat do oblíbených',
      favIcon: this.hi(fav ? 'favourite-filled' : 'favourite', 20, fav ? '#FFFFFF' : '#8a8776'),
      favStyle: 'position:absolute; top:10px; right:10px; z-index:2; width:36px; height:36px; padding:0; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; border:1px solid '
        + (fav ? '#D8763B' : '#ECE3D2') + '; background:' + (fav ? '#D8763B' : 'rgba(255,255,255,.92)')
        + '; box-shadow:0 2px 8px rgba(45,58,46,.12); transition:background .2s, border-color .2s;',
      toggleFav: (e) => {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        const id = this.props.title ?? '';
        const store = this.favStore();
        const next = !fav;
        if (next) store.add(id); else store.delete(id);
        this.setState({ fav: next });
        window.dispatchEvent(new CustomEvent('ek-fav-recipe-change', { detail: { id, fav: next, count: store.size } }));
      },
      title: this.props.title ?? 'Krém na paty a ztvrdlá místa',
      desc: this.props.desc ?? 'Vyživující krém, který změkčí ztvrdlou kůži za pár dní.',
      category: this.props.category ?? 'Kosmetika',
      typeLabel: type,
      isRecipe,
      level,
      time: this.props.time ?? '30 min',
      rating: Number(this.props.rating ?? 4.8),
      ratingCount: Number(this.props.ratingCount ?? 34),
      cta: this.props.cta ?? (isRecipe ? 'Zobrazit recept' : 'Přečíst článek'),
      href: this.props.href ?? '#',
      imgStyle: 'position:absolute; inset:0; background:#EFE7D6 center/cover no-repeat; background-image:url("' + imgUrl + '");',
      hasIng: ing.length > 0,
      ingChips: shown,
      coverage,
      coverStyle: 'display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:' + (complete ? '#4C653D' : '#8a6a4f') + ';',
      coverIcon: this.hi(complete ? 'checkmark-circle-01' : 'information-circle', 15, complete ? '#4C653D' : '#B98253'),
      canAdd: !complete && missing.length > 0,
      addMissing: (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } if (this.props.onAddMissing) this.props.onAddMissing(missing); },
      iconCart: this.hi('shopping-cart-add-01', 15, '#4C653D'),
      iconLevel: this.hi(levelIcons[level] || 'no-signal', 16),
      iconClock: this.hi('clock-01', 16),
      iconArrow: this.hi('arrow-right-02', 16),
    };
  }
}

</script>
</body>
</html>
