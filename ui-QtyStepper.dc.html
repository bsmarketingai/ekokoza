<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .ek-qty-b { border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; width: 46px; height: 100%; transition: background .18s; }
  .ek-qty-b:hover { background: #EFE7D6; }
  .ek-qty-b:disabled { opacity: .35; cursor: not-allowed; background: transparent; }
</style>
</helmet>
<div style="{{ wrapStyle }}">
  <button onClick="{{ dec }}" disabled="{{ atMin }}" class="ek-qty-b" title="Odebrat jeden kus" aria-label="Odebrat jeden kus"><span style="{{ iconMinus }}"></span></button>
  <span style="display:flex; align-items:center; justify-content:center; min-width:46px; text-align:center; font-size:16px; font-weight:600; color:#2A2A24; font-variant-numeric:tabular-nums;">{{ qty }}</span>
  <button onClick="{{ inc }}" disabled="{{ atMax }}" class="ek-qty-b" title="Přidat jeden kus" aria-label="Přidat jeden kus"><span style="{{ iconPlus }}"></span></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:80},&quot;value&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:99,&quot;tsType&quot;:&quot;number&quot;},&quot;min&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:99,&quot;tsType&quot;:&quot;number&quot;},&quot;max&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:99,&quot;min&quot;:1,&quot;max&quot;:999,&quot;tsType&quot;:&quot;number&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(q:number)=&gt;void&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:48,&quot;min&quot;:36,&quot;max&quot;:72,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { qty: null };

  mask(name, size, color) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    return `display:inline-block; width:${size}px; height:${size}px; background-color:${color}; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`;
  }

  set(next) {
    const min = Number(this.props.min ?? 1);
    const max = Number(this.props.max ?? 99);
    const q = Math.min(max, Math.max(min, next));
    this.setState({ qty: q });
    if (this.props.onChange) this.props.onChange(q);
  }

  renderVals() {
    const min = Number(this.props.min ?? 1);
    const max = Number(this.props.max ?? 99);
    const qty = this.state.qty ?? Number(this.props.value ?? min);
    return {
      wrapStyle: "display:inline-flex; align-items:stretch; height:" + Number(this.props.height ?? 48) + "px; border:1.5px solid #CFC4AA; border-radius:999px; background:#fff; overflow:hidden; font-family:'Work Sans',sans-serif;",
      qty,
      atMin: qty <= min,
      atMax: qty >= max,
      dec: () => this.set(qty - 1),
      inc: () => this.set(qty + 1),
      iconMinus: this.mask('minus-sign', 24, '#4C653D'),
      iconPlus: this.mask('plus-sign', 24, '#4C653D'),
    };
  }
}
</script>
</body>
</html>
