<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</helmet>

<span style="{{ wrapStyle }}" title="{{ hint }}">
  <span style="{{ iconStyle }}"></span>
  <span>{{ label }}</span>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:48},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ready&quot;,&quot;packing&quot;,&quot;expected&quot;],&quot;default&quot;:&quot;ready&quot;,&quot;tsType&quot;:&quot;'ready'|'packing'|'expected'&quot;},&quot;date&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;28. 8. 2026&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:13,&quot;min&quot;:11,&quot;max&quot;:18,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  mask(name, size, color) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    return `display:inline-block; width:${size}px; height:${size}px; flex:0 0 auto; background-color:${color}; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`;
  }

  static STATES = {
    ready:   { color: '#4C643C', icon: 'checkmark-circle-01', label: 'Ihned k odeslání',
               hint: 'Varianta je nabalená a připravená. Objednávka odchází většinou následující pracovní den.' },
    packing: { color: '#8A5A28', icon: 'weight-scale-01',     label: 'Musíme to nabalit',
               hint: 'Surovinu máme ve velkém balení a teprve ji navážíme. Odeslání se prodlouží zhruba o den.' },
    expected:{ color: '#6B6B5E', icon: 'calendar-01',         label: 'Očekáváme',
               hint: 'Momentálně není skladem. Uvedené datum je očekávané naskladnění.' },
  };

  renderVals() {
    const key = this.props.state ?? 'ready';
    const s = Component.STATES[key] ?? Component.STATES.ready;
    const size = this.props.size ?? 13;
    const date = this.props.date ?? '28. 8. 2026';

    return {
      label: key === 'expected' ? s.label + ' ' + date : s.label,
      hint: s.hint,
      iconStyle: this.mask(s.icon, Math.round(size * 1.15), s.color),
      wrapStyle: 'display:inline-flex; align-items:center; gap:6px; font-family:\'Hanken Grotesk\',sans-serif; font-size:' + size + 'px; font-weight:600; line-height:1.3; color:' + s.color + ';',
    };
  }
}
</script>
</body>
</html>
