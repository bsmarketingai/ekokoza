<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .ek-g-main { border: none; padding: 0; cursor: zoom-in; display: block; width: 100%; }
  .ek-g-th { border: 1.5px solid #ECE3D2; padding: 0; cursor: pointer; border-radius: 10px; transition: border-color .2s, transform .2s; }
  .ek-g-th:hover { border-color: #4C653D; transform: translateY(-2px); }
  .ek-g-fav { position: absolute; top: 14px; right: 14px; z-index: 3; display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; padding: 0; border-radius: 50%; cursor: pointer; box-shadow: 0 3px 10px rgba(45,58,46,.14); transition: background .2s, border-color .2s, color .2s, transform .2s; }
  .ek-g-fav:hover { transform: scale(1.06); }
  .ek-g-fav-off { background: rgba(255,255,255,.94); border: 1px solid #ECE3D2; }
  .ek-g-fav-off:hover { border-color: #E4D9C2; background: #F6F1E7; }
  .ek-g-fav-on { background: #D8763B; border: 1px solid #D8763B; }
  .ek-g-fav-on:hover { background: #B23803; border-color: #B23803; }
  .ek-g-vid { pointer-events: auto; cursor: pointer; font-family: 'Work Sans',sans-serif; transition: border-color .2s, background .2s; }
  .ek-g-vid:hover { border-color: #D14405 !important; background: #FFFFFF !important; }
  .ek-g-nav { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid rgba(246,241,231,.5); background: rgba(34,48,31,.5); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: background .2s, border-color .2s; }
  .ek-g-nav:hover { background: #4C653D; border-color: #4C653D; }
  @media (max-width: 549px) { .ek-g-nav { width: 40px; height: 40px; } }
</style>
</helmet>
<div style="display:flex; flex-direction:column; gap:14px; font-family:'Work Sans',sans-serif;">
  <div style="position:relative; border:1px solid #ECE3D2; border-radius:14px; overflow:hidden; background:#fff;">
    <button onClick="{{ openZoom }}" class="ek-g-main" title="Zvětšit fotografii" style="{{ mainStyle }}"></button>
    <button onClick="{{ toggleFav }}" class="{{ favClass }}" title="{{ favTitle }}" aria-pressed="{{ fav }}"><span style="{{ favIcon }}"></span></button>
    <span style="position:absolute; top:16px; left:16px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; z-index:2; pointer-events:none;">
      <sc-for list="{{ badges }}" as="b" hint-placeholder-count="2">
        <dc-import name="ui-Badge" variant="{{ b.variant }}" label="{{ b.label }}" hint-size="100px,26px"></dc-import>
      </sc-for>
    </span>
    <span style="position:absolute; right:14px; bottom:14px; z-index:2; display:flex; align-items:center; gap:8px; pointer-events:none;">
      <sc-if value="{{ hasVideo }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ openVideo }}" class="ek-g-vid" title="Přehrát video k produktu" style="display:flex; align-items:center; gap:7px; box-sizing:border-box; height:40px; line-height:1; background:rgba(255,255,255,.94); border:1px solid #ECE3D2; border-radius:999px; padding:0 14px; font-size:12.5px; font-weight:600; color:#4C653D;"><span style="{{ iconVideo }}"></span>Video</button>
      </sc-if>
      <span aria-hidden="true" style="display:flex; align-items:center; gap:7px; box-sizing:border-box; height:40px; line-height:1; background:rgba(255,255,255,.94); border:1px solid #ECE3D2; border-radius:999px; padding:0 14px; font-size:12.5px; font-weight:600; color:#4C653D;"><span style="{{ iconZoom }}"></span>Zvětšit</span>
    </span>
  </div>

  <sc-if value="{{ showThumbs }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="4">
        <button onClick="{{ t.select }}" class="ek-g-th" title="{{ t.alt }}" style="{{ t.style }}"></button>
      </sc-for>
    </div>
  </sc-if>

  <p style="margin:0; font-size:13px; line-height:1.5; color:#6B6B5E; font-style:italic;">{{ note }}</p>

  <sc-if value="{{ zoom }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeZoom }}" role="dialog" aria-label="Galerie produktu" style="position:fixed; inset:0; z-index:300; background:rgba(34,48,31,.9); display:flex; align-items:center; justify-content:center; gap:18px; padding:28px; cursor:zoom-out;">
      <sc-if value="{{ multi }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ lbPrev }}" class="ek-g-nav" aria-label="Předchozí" style="flex:0 0 auto;"><span style="{{ iconPrev }}"></span></button>
      </sc-if>
      <div onClick="{{ stop }}" style="position:relative; cursor:default; display:flex; flex-direction:column; align-items:center; gap:12px; min-width:0;">
        <sc-if value="{{ lbIsImage }}" hint-placeholder-val="{{ true }}">
          <div style="{{ zoomStyle }}"></div>
        </sc-if>
        <sc-if value="{{ lbIsVideo }}" hint-placeholder-val="{{ false }}">
          <video src="{{ videoSrc }}" poster="{{ videoPoster }}" controls="{{ true }}" autoPlay="{{ true }}" playsInline="{{ true }}" style="display:block; width:min(1040px,80vw); max-height:78vh; aspect-ratio:16/9; border-radius:16px; background:#1E261E; object-fit:contain;"></video>
        </sc-if>
        <span style="font-size:13px; color:#D6E0C8;">{{ lbCounter }}</span>
      </div>
      <sc-if value="{{ multi }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ lbNext }}" class="ek-g-nav" aria-label="Další" style="flex:0 0 auto;"><span style="{{ iconNext }}"></span></button>
      </sc-if>
      <span style="position:absolute; top:22px; right:24px; display:flex; align-items:center; gap:8px; color:#F6F1E7; font-size:14px; font-weight:600;"><span style="{{ iconClose }}"></span>Zavřít</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:680},&quot;productName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Kyselina citronová&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;images&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{src:string, alt?:string}[]&quot;},&quot;video&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{src:string, poster?:string}&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Obrázek je pouze ilustrační.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badges&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(string|{variant:string,label?:string})[]&quot;}}">
class Component extends DCLogic {
  state = { i: 0, zoom: false, fav: null, lb: 0 };

  favStore() {
    if (!window.__ekFav) window.__ekFav = new Set();
    return window.__ekFav;
  }

  mask(name, size, color) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    return `display:inline-block; width:${size}px; height:${size}px; flex:0 0 auto; background-color:${color}; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`;
  }

  componentDidMount() {
    this.esc = (e) => {
      if (!this.state.zoom) return;
      if (e.key === 'Escape') this.setState({ zoom: false });
      if (e.key === 'ArrowRight') this.step(1);
      if (e.key === 'ArrowLeft') this.step(-1);
    };
    window.addEventListener('keydown', this.esc);
  }
  step(d) {
    const n = this._lbCount || 1;
    this.setState(s => ({ lb: (s.lb + d + n) % n }));
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.esc); }

  renderVals() {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = (src) => (/^(https?:|\/|\.\.|data:)/.test(src) ? src : base + src);
    const images = this.props.images ?? [
      { src: 'assets/products/kyselina-citronova-1-kg.webp', alt: 'Kyselina citronová 1 kg v papírovém sáčku' },
      { src: 'assets/products/mydlova-hmota-bambucke-maslo-1-kg.jpg', alt: 'Balení zblízka' },
      { src: 'assets/products/stabilizovany-vitamin-c-10-g.jpg', alt: 'Detail krystalů' },
    ];
    const i = Math.min(this.state.i, images.length - 1);
    const active = images[i] || images[0];

    // Položky lightboxu: 1. fotka, pak video (je-li), pak ostatní fotky
    const video = this.props.video ?? null;
    const lbItems = images.map((im, idx) => ({ type: 'img', src: im.src, idx }));
    if (video && video.src) lbItems.splice(Math.min(1, lbItems.length), 0, { type: 'video' });
    this._lbCount = lbItems.length;
    const lbi = Math.min(this.state.lb, lbItems.length - 1);
    const cur = lbItems[lbi] || lbItems[0];
    const zoomSrc = cur && cur.type === 'img' ? cur.src : active.src;
    const favId = this.props.productName ?? 'produkt';
    const favOn = this.state.fav !== null ? this.state.fav : this.favStore().has(favId);

    return {
      note: this.props.note ?? 'Obrázek je pouze ilustrační.',
      badges: (this.props.badges ?? []).map(b => (typeof b === 'string' ? { variant: b, label: '' } : { variant: b.variant, label: b.label ?? '' })),
      zoom: this.state.zoom,
      openZoom: () => this.setState({ zoom: true, lb: Math.max(0, lbItems.findIndex(x => x.type === 'img' && x.idx === i)) }),
      hasVideo: !!(video && video.src),
      openVideo: (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } this.setState({ zoom: true, lb: lbItems.findIndex(x => x.type === 'video') }); },
      videoSrc: video ? url(video.src) : '',
      videoPoster: video && video.poster ? url(video.poster) : '',
      lbIsVideo: cur && cur.type === 'video',
      lbIsImage: !(cur && cur.type === 'video'),
      multi: lbItems.length > 1,
      lbCounter: lbItems.length > 1 ? (lbi + 1) + ' / ' + lbItems.length + (cur && cur.type === 'video' ? ' · video' : '') : '',
      lbPrev: (e) => { e.stopPropagation(); this.step(-1); },
      lbNext: (e) => { e.stopPropagation(); this.step(1); },
      stop: (e) => e.stopPropagation(),
      iconVideo: this.mask('play', 20, '#D14405'),
      iconPrev: this.mask('arrow-left-01', 24, '#F6F1E7'),
      iconNext: this.mask('arrow-right-01', 24, '#F6F1E7'),
      closeZoom: () => this.setState({ zoom: false }),
      mainStyle: 'aspect-ratio:1/1; background:#fff center/contain no-repeat; background-image:url("' + url(active.src) + '");',
      zoomStyle: 'width:min(820px,92vw,84vh); max-width:92vw; max-height:84vh; aspect-ratio:1/1; border-radius:16px; background:#fff center/contain no-repeat; background-image:url("' + url(zoomSrc) + '");',
      showThumbs: this.props.showThumbs === true && images.length > 1,
      thumbs: images.map((im, idx) => ({
        alt: im.alt || '',
        select: () => this.setState({ i: idx }),
        style: 'width:78px; height:78px; background:#fff center/contain no-repeat; background-image:url("' + url(im.src) + '");'
          + (idx === i ? ' border-color:#4C653D; box-shadow:0 0 0 2px rgba(76,101,61,.22);' : ''),
      })),
      fav: favOn,
      favClass: 'ek-g-fav ' + (favOn ? 'ek-g-fav-on' : 'ek-g-fav-off'),
      favTitle: favOn ? 'Odebrat z oblíbených' : 'Přidat do oblíbených',
      favIcon: this.mask(favOn ? 'favourite-filled' : 'favourite', 21, favOn ? '#FFFFFF' : '#8a8776'),
      toggleFav: (e) => {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        const store = this.favStore();
        const next = !favOn;
        if (next) store.add(favId); else store.delete(favId);
        this.setState({ fav: next });
        window.dispatchEvent(new CustomEvent('ek-fav-change', { detail: { count: store.size } }));
      },
      iconZoom: this.mask('zoom-in-01', 20, '#4C653D'),
      iconClose: this.mask('cancel-01', 24, '#F6F1E7'),
    };
  }
}
</script>
</body>
</html>
