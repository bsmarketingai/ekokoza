<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .ek-bb { position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; background: rgba(255,253,246,.97); backdrop-filter: blur(8px); border-top: 1px solid #E4DAC6; box-shadow: 0 -14px 30px -22px rgba(45,58,46,.55); transition: transform .28s ease, opacity .28s ease; }
  .ek-bb-in { max-width: 1280px; margin: 0 auto; padding: 12px 32px; display: flex; align-items: center; justify-content: space-between; gap: 22px; }
  .ek-bb-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 999px; padding: 0 28px; font-family: 'Work Sans',sans-serif; font-size: 15.5px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .2s, border-color .2s, color .2s; }
  .ek-bb-main:hover { background: #B23803 !important; border-color: #B23803 !important; }
  .ek-bb-sec:hover { background: #4C653D !important; color: #F6F1E7 !important; }
  .ek-bb-sec:hover span { background-color: #F6F1E7 !important; }
  .ek-bb-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px 4px 11px; border: 1px solid #CFE0B4; border-radius: 999px; background: #F4F7EA; font-family: 'Work Sans',sans-serif; font-size: 12.5px; font-weight: 600; color: #4C653D; white-space: nowrap; cursor: pointer; transition: background .2s, border-color .2s; }
  .ek-bb-chip:hover { background: #E7F0D6; border-color: #4C653D; }
  .ek-bb-pop { position: absolute; bottom: calc(100% + 12px); left: 32px; width: min(420px, calc(100vw - 32px)); background: #fff; border: 1px solid #E4DAC6; border-radius: 16px; box-shadow: 0 22px 48px -24px rgba(45,58,46,.5); padding: 18px 20px 20px; }
  @media (max-width: 980px) { .ek-bb-pop { left: 16px; right: 16px; width: auto; } .ek-bb-note { display: none; } }
  @media (max-width: 980px) {
    .ek-bb-in { padding: 10px 16px; gap: 12px; }
    .ek-bb-thumb { display: none !important; }
    .ek-bb-title { display: none !important; }
  }
  @media (max-width: 600px) {
    .ek-bb-qty { display: none !important; }
    .ek-bb-btn { flex: 1; padding: 0 18px; }
  }
</style>
</helmet>
<div class="ek-bb" style="{{ barStyle }}">
  <sc-if value="{{ popOpen }}" hint-placeholder-val="{{ false }}">
    <div class="ek-bb-pop">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:12px;">
        <span style="font-family:'EB Garamond',serif; font-size:19px; color:#2D3A2E;">Vyberte variantu</span>
        <button onClick="{{ closePop }}" title="Zavřít" aria-label="Zavřít" style="border:none; background:transparent; cursor:pointer; display:flex; padding:4px;"><span style="{{ iconClose }}"></span></button>
      </div>
      <dc-import name="ui-VariantPicker" variants="{{ variants }}" selected="{{ selected }}" heading="" onSelect="{{ pick }}" hint-size="100%,240px"></dc-import>
    </div>
  </sc-if>
  <div class="ek-bb-in">
    <div style="display:flex; align-items:center; gap:14px; min-width:0;">
      <span class="ek-bb-thumb" style="{{ thumbStyle }}"></span>
      <span style="display:flex; flex-direction:column; gap:3px; min-width:0;">
        <span class="ek-bb-title" style="font-family:'EB Garamond',serif; font-size:17px; line-height:1.2; color:#2D3A2E; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ title }}</span>
        <span style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <sc-if value="{{ hasVariant }}" hint-placeholder-val="{{ true }}">
            <button onClick="{{ togglePop }}" class="ek-bb-chip" title="Změnit variantu">{{ variantLabel }}<span style="{{ iconCaret }}"></span></button>
          </sc-if>
          <span style="font-family:'EB Garamond',serif; font-size:21px; line-height:1; color:#2D3A2E; white-space:nowrap;">{{ price }}</span>
          <dc-import name="ui-Stock" state="{{ stockState }}" date="{{ stockDate }}" variant="pill" withNote="{{ true }}" size="{{ 13 }}" hint-size="170px,30px"></dc-import>
          <span class="ek-bb-note" style="font-size:12.5px; color:#6B6B5E; white-space:nowrap;">{{ note }}</span>
        </span>
      </span>
    </div>

    <div style="display:flex; align-items:center; gap:12px; flex:0 0 auto; min-width:0;">
      <sc-if value="{{ modeBuy }}" hint-placeholder-val="{{ true }}">
        <span class="ek-bb-qty" style="display:flex;">
          <dc-import name="ui-QtyStepper" value="{{ qty }}" max="{{ max }}" height="{{ 48 }}" onChange="{{ onQty }}" hint-size="150px,48px"></dc-import>
        </span>
      </sc-if>
      <sc-if value="{{ modeBuy }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ add }}" class="ek-bb-btn ek-bb-main" style="height:48px; background:#D14405; color:#fff; border:1.5px solid #D14405;"><span style="{{ iconCart }}"></span>Do košíku</button>
      </sc-if>
      <sc-if value="{{ modePick }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ goPick }}" class="ek-bb-btn ek-bb-main" style="height:48px; background:#D14405; color:#fff; border:1.5px solid #D14405;">Vyberte variantu<span style="{{ iconArrowUp }}"></span></button>
      </sc-if>
      <sc-if value="{{ modeWatch }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ goPick }}" class="ek-bb-btn ek-bb-sec" style="height:48px; background:transparent; color:#4C653D; border:1.5px solid #4C653D;"><span style="{{ iconBell }}"></span>Hlídací pes</button>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:100},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Kyselina citronová&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variantLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1 kg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variants&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:20,&quot;tsType&quot;:&quot;number&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i:number,v:object)=&gt;void&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;110 Kč&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;110 Kč / kg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/products/kyselina-citronova-1-kg.webp&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;buyable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;needsVariant&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;max&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:99,&quot;min&quot;:1,&quot;max&quot;:999,&quot;tsType&quot;:&quot;number&quot;},&quot;watch&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#ek-buy-cta&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;pickTarget&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#ek-buy-cta&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onAdd&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(qty:number)=&gt;void&quot;},&quot;onQtyChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(qty:number)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { shown: false, qty: null, pop: false };

  mask(name, size, color) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    return `display:inline-block; width:${size}px; height:${size}px; flex:0 0 auto; background-color:${color}; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`;
  }

  componentDidMount() {
    // Bar se objevi, az hlavni tlacitko Do kosiku odscrolluje z obrazovky
    const sel = this.props.watch ?? '#ek-buy-cta';
    const attach = () => {
      const el = document.querySelector(sel);
      if (!el) { this.retry = setTimeout(attach, 400); return; }
      this.io = new IntersectionObserver(
        ([e]) => this.setState({ shown: !e.isIntersecting && e.boundingClientRect.top < 0 }),
        { threshold: 0 }
      );
      this.io.observe(el);
    };
    attach();
  }
  componentWillUnmount() {
    if (this.io) this.io.disconnect();
    if (this.retry) clearTimeout(this.retry);
  }

  scrollToTarget() {
    const el = document.querySelector(this.props.pickTarget ?? '#ek-buy-cta');
    if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 200, behavior: 'smooth' });
  }

  renderVals() {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const img = this.props.img ?? 'assets/products/kyselina-citronova-1-kg.webp';
    const imgUrl = /^(https?:|\/|\.\.|data:)/.test(img) ? img : base + img;
    const variantLabel = this.props.variantLabel ?? '';
    const needsVariant = this.props.needsVariant ?? false;
    const buyable = this.props.buyable ?? true;
    const qty = this.state.qty ?? Number(this.props.qty ?? 1);
    const shown = this.state.shown;

    return {
      barStyle: shown ? 'transform:translateY(0); opacity:1;' : 'transform:translateY(110%); opacity:0; pointer-events:none;',
      variants: this.props.variants ?? [],
      selected: Number(this.props.selected ?? 0),
      popOpen: shown && this.state.pop && (this.props.variants || []).length > 1,
      togglePop: () => this.setState({ pop: !this.state.pop }),
      closePop: () => this.setState({ pop: false }),
      pick: (i, v) => {
        this.setState({ pop: false });
        if (this.props.onSelect) this.props.onSelect(i, v);
      },
      iconCaret: this.mask('arrow-up-01', 16, '#4C653D'),
      iconClose: this.mask('cancel-01', 20, '#6B6B5E'),
      title: this.props.title ?? 'Kyselina citronová',
      hasVariant: !!variantLabel && !needsVariant,
      variantLabel,
      price: this.props.price ?? '',
      note: this.props.note ?? '',
      stockState: this.props.stockState ?? 'ready',
      stockDate: this.props.stockDate ?? '',
      thumbStyle: 'width:52px; height:52px; flex:0 0 auto; border:1px solid #ECE3D2; border-radius:10px; background:#fff center/contain no-repeat; background-image:url("' + imgUrl + '");',
      modeBuy: buyable && !needsVariant,
      modePick: needsVariant,
      modeWatch: !buyable && !needsVariant,
      max: Number(this.props.max ?? 99),
      qty,
      onQty: (q) => { this.setState({ qty: q }); if (this.props.onQtyChange) this.props.onQtyChange(q); },
      add: () => { if (this.props.onAdd) this.props.onAdd(qty); },
      goPick: () => this.scrollToTarget(),
      iconCart: this.mask('shopping-cart-check-in-01', 24, 'currentColor'),
      iconBell: this.mask('notification-01', 24, 'currentColor'),
      iconArrowUp: this.mask('arrow-up-01', 24, 'currentColor'),
    };
  }
}
</script>
</body>
</html>
