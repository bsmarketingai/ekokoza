<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  .ek-btn-ghost:hover { background: #EFE7D6 !important; }
  .ek-btn-secondary:hover { background: #3B5531 !important; color: #F6F1E7 !important; }
  .ek-btn-main:hover { background: #BC5F28 !important; border-color: #BC5F28 !important; }
  .ek-btn-primary:hover { background: #3B5531 !important; border-color: #3B5531 !important; }
  .ek-btn-fb:hover { background: #375593 !important; }
  .ek-field:focus-within { border-color: #4C643C !important; box-shadow: 0 0 0 3px rgba(76,100,60,.14); }
  .ek-login-link { color: #3B5531; text-decoration: none; background-image: linear-gradient(#4C643C,#4C643C); background-size: 100% 1px; background-repeat: no-repeat; background-position: 0 100%; transition: color .2s, background-size .25s; }
  .ek-login-link:hover { color: #D8763B; background-image: linear-gradient(#D8763B,#D8763B); }
  .ek-check:hover .ek-check-box { border-color: #4C643C; }
  .ek-check-box { width:22px; height:22px; flex:0 0 auto; border-radius:6px; display:flex; align-items:center; justify-content:center; border:1.5px solid #D9D0BC; background:#fff; transition:background .18s, border-color .18s; }
  .ek-check-mark { opacity:0; transition:opacity .15s; }
  .ek-check-input:checked + .ek-check-box { background:#4C643C; border-color:#4C643C; }
  .ek-check-input:checked + .ek-check-box .ek-check-mark { opacity:1; }
  .ek-check-input:focus-visible + .ek-check-box { box-shadow:0 0 0 3px rgba(76,100,60,.24); }
  /* Standalone nahled: bez ukotveni v hlavicce se karta pozicuje v beznem toku */
  .ek-login-pop { position: static; }
  .ek-hdr-userwrap .ek-login-pop { position: absolute; }
  .ek-cart-pop { position: static; }
  .ek-hdr-cartwrap .ek-cart-pop { position: absolute; }
  @media (max-width: 900px) {
    .ek-login-pop { position: fixed !important; inset: 0 !important; padding-top: 0 !important; width: auto !important; max-width: none !important; z-index: 300 !important; }
    .ek-login-card { height: 100% !important; border-radius: 0 !important; border: none !important; box-shadow: none !important; overflow-y: auto !important; }
    .ek-login-head { padding-top: max(20px, env(safe-area-inset-top)) !important; }
    .ek-login-body { padding-bottom: max(24px, env(safe-area-inset-bottom)) !important; }
  }
</style>
</helmet>

<div class="ek-login-pop" style="top:100%; right:0; padding-top:14px; width:400px; max-width:calc(100vw - 24px); z-index:200; font-family:'Hanken Grotesk',sans-serif;">
<div class="ek-login-card" style="background:#fff; border:1px solid #E4DAC6; border-radius:14px; box-shadow:0 34px 64px -30px rgba(45,58,46,.55); display:flex; flex-direction:column; overflow:hidden;">

  <div class="ek-login-head" style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:20px 24px 6px;">
    <h2 style="margin:0; font-family:'Spectral',serif; font-weight:500; font-size:26px; color:#2D3A2E; line-height:1.1;">Přihlaste se</h2>
    <button type="button" onClick="{{ onClose }}" title="Zavřít" class="ek-btn-ghost" style="appearance:none; border:none; cursor:pointer; width:34px; height:34px; flex:0 0 auto; border-radius:50%; background:#F6F1E7; color:#3B5531; display:flex; align-items:center; justify-content:center; transition:background .2s;"><span style="{{ iconClose }}"></span></button>
  </div>

  <form class="ek-login-body" onSubmit="{{ onSubmit }}" style="padding:14px 24px 24px; display:flex; flex-direction:column; gap:14px;">

    <label class="ek-field" style="display:flex; align-items:center; gap:11px; border:1.5px solid #D9D0BC; border-radius:12px; padding:13px 16px; transition:border-color .2s, box-shadow .2s;">
      <span style="{{ iconMail }}"></span>
      <input type="email" name="email" autoComplete="email" placeholder="Váš e-mail" style="flex:1; min-width:0; border:none; outline:none; background:transparent; font-family:'Hanken Grotesk',sans-serif; font-size:16px; color:#2A2A24;">
    </label>

    <label class="ek-field" style="display:flex; align-items:center; gap:11px; border:1.5px solid #D9D0BC; border-radius:12px; padding:13px 16px; transition:border-color .2s, box-shadow .2s;">
      <span style="{{ iconKey }}"></span>
      <input type="password" name="password" autoComplete="current-password" placeholder="Vaše heslo" style="flex:1; min-width:0; border:none; outline:none; background:transparent; font-family:'Hanken Grotesk',sans-serif; font-size:16px; color:#2A2A24;">
    </label>

    <a href="{{ forgotHref }}" class="ek-login-link" style="align-self:flex-start; margin-top:-6px; font-size:14.5px;">Nevíte heslo?</a>

    <div style="display:flex; align-items:center; gap:10px;">
      <a href="{{ registerHref }}" class="ek-btn-ghost" style="flex:1; display:flex; align-items:center; justify-content:center; background:transparent; border:1.5px solid transparent; color:#3B5531; gap:9px; text-decoration:none; padding:12.5px 20px; border-radius:999px; font-weight:600; font-size:15.5px; transition:background .2s; white-space:nowrap;">Registrace<span style="{{ iconRegister }}"></span></a>
      <button type="submit" class="ek-btn-primary" style="flex:1; appearance:none; border:1.5px solid #4C643C; cursor:pointer; background:#4C643C; color:#F6F1E7; padding:12.5px 20px; border-radius:999px; font-family:'Hanken Grotesk',sans-serif; display:flex; align-items:center; justify-content:center; gap:9px; font-weight:600; font-size:15.5px; transition:background .2s; white-space:nowrap;">Přihlásit se<span style="{{ iconLogin }}"></span></button>
    </div>

    <label class="ek-check" style="display:flex; align-items:center; gap:10px; cursor:pointer; font-size:15px; color:#2A2A24; min-height:44px;">
      <input type="checkbox" name="remember" class="ek-check-input" style="position:absolute; opacity:0; width:22px; height:22px; margin:0;">
      <span class="ek-check-box"><span class="ek-check-mark" style="{{ checkMark }}"></span></span>
      Přihlásit trvale
    </label>

    <span style="height:1px; background:#EFE7D6; margin:4px 0;"></span>

    <a href="{{ facebookHref }}" class="ek-btn-fb" style="display:flex; align-items:center; justify-content:center; gap:11px; background:#4267B2; color:#fff; text-decoration:none; padding:14px 20px; border-radius:999px; font-weight:600; font-size:15.5px; transition:background .2s;"><span style="{{ iconFb }}"></span>Přihlásit se přes Facebook</a>

  </form>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:480},&quot;forgotHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;registerHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;facebookHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onSubmit&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e)=&gt;void&quot;}}">
class Component extends DCLogic {
  mask(name, size, color) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    return `display:inline-block; width:${size}px; height:${size}px; flex:0 0 auto; background-color:${color || 'currentColor'}; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`;
  }

  renderVals() {
    return {
      onClose: this.props.onClose ?? (() => {}),
      onSubmit: this.props.onSubmit ?? ((e) => e.preventDefault()),
      forgotHref: this.props.forgotHref ?? '#',
      registerHref: this.props.registerHref ?? '#',
      facebookHref: this.props.facebookHref ?? '#',
      checkMark: this.mask('tick-01', 15, '#F6F1E7'),
      iconMail: this.mask('mail-01', 24, '#8a8776'),
      iconKey: this.mask('square-lock-01', 24, '#8a8776'),
      iconClose: this.mask('cancel-01', 20),
      iconFb: this.mask('facebook-01', 20, '#fff'),
      iconRegister: this.mask('user-account', 20, '#3B5531'),
      iconLogin: this.mask('user', 20, '#F6F1E7'),
    };
  }
}
</script>
</body>
</html>
