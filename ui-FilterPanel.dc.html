<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  .ek-fp-fac { position: relative; display: flex; align-items: center; gap: 12px; padding: 9px 4px; cursor: pointer; font-family: 'Work Sans',sans-serif; font-size: 15px; color: #2A2A24; border-radius: 10px; }
  .ek-fp-fac:hover { background: #FBF8F1; }
</style>
</helmet>

<div style="{{ hostStyle }}">
  <sc-if value="{{ showHead }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:16px; padding:22px 24px; border-bottom:1px solid #EFE7D6;">
      <span style="display:flex; align-items:center; gap:10px; font-family:'EB Garamond',serif; font-size:24px; color:#2D3A2E;"><span style="{{ iconTitle }}"></span>Filtrovat produkty</span>
      <button onClick="{{ onClose }}" title="Zavřít" aria-label="Zavřít filtry" style="border:none; background:transparent; cursor:pointer; display:flex; padding:6px;"><span style="{{ iconClose }}"></span></button>
    </div>
  </sc-if>

  <div style="{{ bodyStyle }}">
    <sc-if value="{{ isSidebar }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex; align-items:center; gap:10px; padding:4px 0 14px;">
        <span style="{{ iconTitle }}"></span>
        <span style="font-family:'EB Garamond',serif; font-weight:500; font-size:21px; color:#2D3A2E;">Filtrovat produkty</span>
      </div>
    </sc-if>

    <div style="padding:18px 0; border-bottom:1px solid #EFE7D6;">
      <span style="display:block; font-size:13px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:#4F6E2A; margin-bottom:12px;">Cena za balení</span>
      <div style="display:flex; align-items:center; gap:12px;">
        <label style="display:flex; flex-direction:column; gap:5px; flex:1; min-width:0;">
          <span style="font-size:12.5px; color:#6B6B5E;">od</span>
          <input type="number" value="{{ priceMin }}" onChange="{{ onPriceMin }}" style="width:100%; height:46px; padding:0 14px; border:1.5px solid #CFC4AA; border-radius:12px; background:#fff; font-family:'Work Sans',sans-serif; font-size:15px; color:#2A2A24;">
        </label>
        <span style="align-self:flex-end; height:46px; display:flex; align-items:center; color:#CFC4AA;">–</span>
        <label style="display:flex; flex-direction:column; gap:5px; flex:1; min-width:0;">
          <span style="font-size:12.5px; color:#6B6B5E;">do</span>
          <input type="number" value="{{ priceMax }}" onChange="{{ onPriceMax }}" style="width:100%; height:46px; padding:0 14px; border:1.5px solid #CFC4AA; border-radius:12px; background:#fff; font-family:'Work Sans',sans-serif; font-size:15px; color:#2A2A24;">
        </label>
      </div>
    </div>

    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
      <div style="padding:18px 0; border-bottom:1px solid #EFE7D6;">
        <button onClick="{{ g.toggle }}" style="display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; border:none; background:transparent; padding:0; cursor:pointer; text-align:left;">
          <span style="font-size:13px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:#4F6E2A; font-family:'Work Sans',sans-serif;">{{ g.label }}</span>
          <span style="{{ g.caret }}"></span>
        </button>
        <sc-if value="{{ g.open }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex; flex-direction:column; margin-top:8px;">
            <sc-for list="{{ g.options }}" as="o" hint-placeholder-count="5">
              <label class="ek-fp-fac" style="{{ o.rowStyle }}">
                <input type="checkbox" checked="{{ o.on }}" disabled="{{ o.disabled }}" onChange="{{ o.toggle }}" style="position:absolute; width:22px; height:22px; opacity:0; margin:0; cursor:pointer;">
                <span style="{{ o.box }}"><span style="{{ o.tick }}"></span></span>
                <span style="flex:1; min-width:0;">{{ o.label }}</span>
                <span style="font-size:13px; color:#8a8776;">{{ o.count }}</span>
              </label>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <div style="{{ footStyle }}">
    <button onClick="{{ onClear }}" style="border:1.5px solid transparent; background:transparent; border-radius:999px; padding:13px 18px; font-family:'Work Sans',sans-serif; font-size:14.5px; font-weight:600; color:#4C653D; cursor:pointer;" style-hover="background:#EFE7D6">Zrušit vše</button>
    <sc-if value="{{ showApply }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ onClose }}" style="flex:1; border:1.5px solid #D14405; background:#D14405; color:#fff; border-radius:999px; padding:13px 20px; font-family:'Work Sans',sans-serif; font-size:15.5px; font-weight:600; cursor:pointer;" style-hover="background:#B23803; border-color:#B23803">{{ applyLabel }}</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:620},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;drawer&quot;,&quot;sidebar&quot;],&quot;default&quot;:&quot;sidebar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;groups&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;},&quot;priceMin&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;priceMax&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;applyLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Zobrazit produkty&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onPriceMin&quot;:{&quot;editor&quot;:null},&quot;onPriceMax&quot;:{&quot;editor&quot;:null},&quot;onClear&quot;:{&quot;editor&quot;:null},&quot;onClose&quot;:{&quot;editor&quot;:null}}">
class Component extends DCLogic {
  mask(name, size, color) {
    const url = 'assets/icons/' + name + '.svg';
    return `display:inline-block; width:${size}px; height:${size}px; flex:0 0 auto; background-color:${color}; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`;
  }

  renderVals() {
    const sidebar = this.props.variant === 'sidebar';
    return {
      isSidebar: sidebar,
      showHead: !sidebar,
      showApply: !sidebar,
      groups: this.props.groups ?? [],
      priceMin: this.props.priceMin ?? '',
      priceMax: this.props.priceMax ?? '',
      onPriceMin: this.props.onPriceMin ?? null,
      onPriceMax: this.props.onPriceMax ?? null,
      onClear: this.props.onClear ?? null,
      onClose: this.props.onClose ?? null,
      applyLabel: this.props.applyLabel ?? 'Zobrazit produkty',
      iconTitle: this.mask('filter', 22, '#4C653D'),
      iconClose: this.mask('cancel-01', 22, '#4C653D'),
      hostStyle: sidebar
        ? "display:flex; flex-direction:column; padding:18px 20px; background:#fff; border:1px solid #ECE3D2; border-radius:14px; font-family:'Work Sans',sans-serif;"
        : "display:flex; flex-direction:column; height:100%; font-family:'Work Sans',sans-serif;",
      bodyStyle: sidebar ? 'display:flex; flex-direction:column;' : 'flex:1; overflow-y:auto; padding:8px 24px 24px;',
      footStyle: sidebar
        ? 'display:flex; align-items:center; gap:12px; padding-top:14px;'
        : 'display:flex; align-items:center; gap:12px; padding:18px 24px; border-top:1px solid #EFE7D6; background:#FDFBF5;',
    };
  }
}
</script>
</body>
</html>
