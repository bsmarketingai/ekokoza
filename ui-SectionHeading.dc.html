<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ wrapStyle }}">
  <div>
    <sc-if value="{{ kicker }}" hint-placeholder-val="{{ true }}">
      <p style="margin:0 0 8px; color:#D8763B; font-size:13px; letter-spacing:.16em; text-transform:uppercase; font-weight:600; font-family:'Hanken Grotesk',sans-serif;">{{ kicker }}</p>
    </sc-if>
    <h2 style="{{ titleStyle }}">{{ title }}</h2>
    <sc-if value="{{ subtitle }}" hint-placeholder-val="{{ true }}">
      <p style="margin:8px 0 0; color:#6B6B5E; font-size:17px; font-family:'Hanken Grotesk',sans-serif;">{{ subtitle }}</p>
    </sc-if>
  </div>
  <sc-if value="{{ linkLabel }}" hint-placeholder-val="{{ true }}">
    <a href="{{ linkHref }}" style="color:#3B5531; text-decoration:none; font-weight:600; font-size:15px; white-space:nowrap; font-family:'Hanken Grotesk',sans-serif;">{{ linkLabel }} →</a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:140},&quot;kicker&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Rozcestník&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Co chcete vyrábět?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;linkLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Vše ke tvorbě&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;linkHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;align&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;left&quot;,&quot;center&quot;],&quot;default&quot;:&quot;left&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;md&quot;,&quot;lg&quot;],&quot;default&quot;:&quot;lg&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const align = this.props.align ?? 'left';
    const size = this.props.size ?? 'lg';
    const sizes = { md: '34px', lg: '40px' };
    return {
      kicker: this.props.kicker ?? '',
      title: this.props.title ?? 'Co chcete vyrábět?',
      subtitle: this.props.subtitle ?? '',
      linkLabel: this.props.linkLabel ?? '',
      linkHref: this.props.linkHref ?? '#',
      wrapStyle: align === 'center'
        ? 'display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; margin-bottom:30px;'
        : 'display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:26px;',
      titleStyle: `margin:0; font-family:'Spectral',serif; font-weight:400; font-size:${sizes[size]}; color:#3B5531; line-height:1.05;`,
    };
  }
}
</script>
</body>
</html>
