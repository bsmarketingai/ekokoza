<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a href="{{ href }}" class="ek-card" style="display:flex; align-items:center; gap:14px; padding:12px 16px; background:#fff; border:1px solid #ECE3D2; border-radius:14px; text-decoration:none; color:#2A2A24; transition:transform .25s, box-shadow .25s; font-family:'Work Sans',sans-serif;">
  <span style="{{ thumbStyle }}">
    <span style="{{ imgStyle }}"></span>
  </span>
  <span style="font-weight:600; font-size:16px;">{{ title }}</span>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:100},&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Oleje&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/categories/oleje.png&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const icon = this.props.icon ?? '';
    const iconColor = this.props.iconColor ?? '#4C653D';
    return {
      title: this.props.title ?? 'Oleje',
      thumbStyle: 'width:56px; height:56px; flex-shrink:0; border-radius:12px; background:' + (icon ? '#F4F7EA' : '#F6F1E7') + '; overflow:hidden; display:flex; align-items:center; justify-content:center;',
      imgStyle: icon
        ? 'display:block; width:26px; height:26px; background-color:' + iconColor + '; -webkit-mask:url("assets/icons/' + icon + '.svg") center / contain no-repeat; mask:url("assets/icons/' + icon + '.svg") center / contain no-repeat;'
        : 'display:block; width:100%; height:100%; background:center/contain no-repeat url("' + (this.props.img ?? 'assets/categories/oleje.png') + '");',
      href: this.props.href ?? '#',
    };
  }
}
</script>
</body>
</html>
