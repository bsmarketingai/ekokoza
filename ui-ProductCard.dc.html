<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .ek-btn-ghost:hover { background: #EFE7D6; }
  .ek-card-t:hover { color: #B23803 !important; }
</style>
</helmet>
<div class="ek-card" style="display:flex; flex-direction:column; background:#fff; border:1px solid #ECE3D2; border-radius:14px; overflow:hidden; transition:transform .25s, box-shadow .25s; font-family:'Work Sans',sans-serif;">

  <div style="position:relative; aspect-ratio:1/1; background:#fff;">
    <a href="{{ href }}" title="{{ title }}" style="position:absolute; inset:0; z-index:1; display:block; text-decoration:none;"></a>
    <div style="{{ imgStyle }}"></div>

    <sc-if value="{{ badge }}" hint-placeholder-val="{{ true }}">
      <span style="position:absolute; top:12px; left:12px; z-index:2;">
        <dc-import name="ui-Badge" variant="{{ badge }}" label="{{ badgeLabel }}" hint-size="90px,24px"></dc-import>
      </span>
    </sc-if>

    <button onClick="{{ toggleFav }}" class="{{ favClass }}" title="{{ favTitle }}" style="{{ favStyle }}">
      <span style="{{ favIcon }}"></span>
    </button>
  </div>

  <div style="padding:16px; display:flex; flex-direction:column; gap:9px; flex:1;">
    <dc-import name="ui-Rating" compact="{{ true }}" value="{{ rating }}" count="{{ ratingCount }}" hint-size="120px,18px"></dc-import>
    <h3 style="margin:0; font-family:'EB Garamond',serif; font-weight:500; font-size:18px; line-height:1.25;"><a href="{{ href }}" class="ek-card-t" style="color:#2A2A24; text-decoration:none;">{{ title }}</a></h3>
    <dc-import name="ui-Stock" state="{{ stockState }}" date="{{ stockDate }}" size="{{ 13 }}" hint-size="140px,18px"></dc-import>
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:auto;">
      <span style="font-family:'EB Garamond',serif; font-size:19px; color:#4C653D; font-weight:500; white-space:nowrap;">{{ price }}</span>
      <sc-if value="{{ buyable }}" hint-placeholder-val="{{ true }}">
        <a href="{{ href }}" class="ek-btn-main" style="background:#D14405; color:#fff; text-decoration:none; padding:9px 16px; border-radius:999px; font-weight:600; font-size:13.5px; transition:background .2s; white-space:nowrap;">{{ ctaLabel }}</a>
      </sc-if>
    </div>
    <sc-if value="{{ notBuyable }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; flex-direction:column; gap:8px;">
        <span style="font-size:13px; color:#6B6B5E;">Tento produkt nelze zakoupit</span>
        <a href="{{ watchHref }}" class="ek-btn-ghost" style="display:flex; align-items:center; justify-content:center; gap:8px; border:1.5px solid #4C653D; color:#4C653D; text-decoration:none; padding:9px 16px; border-radius:999px; font-weight:600; font-size:13.5px; transition:background .2s;"><span style="{{ iconWatch }}"></span>Hlídací pes</a>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:430},&quot;fav&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Levandulové máslo, 100 g&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Obsah&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;189 Kč&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Obsah&quot;},&quot;stockState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ready&quot;,&quot;packing&quot;,&quot;expected&quot;],&quot;default&quot;:&quot;ready&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Obsah&quot;},&quot;stockDate&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;28. 8. 2026&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Obsah&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/products/levandulove-maslo-100-g.jpg&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Obsah&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Obsah&quot;},&quot;ctaVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;koupit&quot;,&quot;varianta&quot;],&quot;default&quot;:&quot;koupit&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Akce&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;bestseller&quot;,&quot;novinka&quot;,&quot;doporucujeme&quot;,&quot;akce&quot;,&quot;sleva&quot;,&quot;prirodni&quot;,&quot;bio&quot;,&quot;sada&quot;],&quot;default&quot;:&quot;bestseller&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Badge&quot;},&quot;badgeLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Badge&quot;},&quot;rating&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:4.6,&quot;min&quot;:0,&quot;max&quot;:5,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Hodnocení&quot;},&quot;ratingCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:84,&quot;min&quot;:0,&quot;max&quot;:9999,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Hodnocení&quot;}}">
class Component extends DCLogic {
  state = { fav: null };

  // Sdileny seznam oblibenych — cte ho hlavicka pres udalost 'ek-fav-change'
  favStore() {
    if (!window.__ekFav) window.__ekFav = new Set();
    return window.__ekFav;
  }

  componentDidMount() {
    const id = this.props.title ?? 'Levandulové máslo, 100 g';
    if (this.props.fav) this.favStore().add(id);
    if (this.favStore().has(id)) {
      this.setState({ fav: true });
      window.dispatchEvent(new CustomEvent('ek-fav-change', { detail: { count: this.favStore().size } }));
    }
  }

  mask(name, size) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    return `display:inline-block; width:${size}px; height:${size}px; flex:0 0 auto; background-color:currentColor; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`;
  }

  renderVals() {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const img = this.props.img ?? 'assets/products/levandulove-maslo-100-g.jpg';
    const imgUrl = /^(https?:|\/|\.\.)/.test(img) ? img : base + img;

    // Zpetna kompatibilita: starsi volani predavaji volny text ve `stock`
    const legacy = this.props.stock;
    const inferred = legacy == null ? 'ready'
      : /nabalit|nava/i.test(legacy) ? 'packing'
      : /oceka|naskladn/i.test(legacy) ? 'expected'
      : /nedostup|vyprod|nelze/i.test(legacy) ? 'unavail'
      : /nenab|vyraz/i.test(legacy) ? 'ended'
      : 'ready';
    const stockState = this.props.stockState ?? inferred;
    // Nakoupitelné je vše až po úroveň 3 (Očekáváme) — viz semantická škála v ui-Stock
    const buyable = !['unavail', 'unavailable', 'ended', 'discontinued', 'out'].includes(stockState);

    // CTA: single-variant products buy directly, multi-variant pick a variant
    const ctaVariant = this.props.ctaVariant ?? 'koupit';
    const ctaLabel = ctaVariant === 'varianta' ? 'Vybrat variantu' : 'Koupit';

    const fav = this.state.fav !== null ? this.state.fav : !!this.props.fav;

    return {
      title: this.props.title ?? 'Levandulové máslo, 100 g',
      price: this.props.price ?? '189 Kč',
      badge: this.props.badge ?? 'bestseller',
      badgeLabel: this.props.badgeLabel ?? '',
      rating: this.props.rating ?? 4.6,
      ratingCount: this.props.ratingCount ?? 84,
      href: this.props.href ?? '#',
      ctaLabel,
      stockState,
      stockDate: this.props.stockDate ?? '28. 8. 2026',
      buyable,
      notBuyable: !buyable,
      watchHref: this.props.watchHref ?? '#',
      iconWatch: this.mask('notification-01', 20),
      imgStyle: 'position:absolute; inset:14px; background:#fff center/contain no-repeat; background-image:url("' + imgUrl + '");',
      favStyle: [
        'position:absolute', 'top:10px', 'right:10px', 'z-index:2',
        'width:36px', 'height:36px', 'padding:0', 'border-radius:50%', 'cursor:pointer',
        'display:flex', 'align-items:center', 'justify-content:center',
        'border:1px solid ' + (fav ? '#D8763B' : '#ECE3D2'),
        'background:' + (fav ? '#D8763B' : 'rgba(255,255,255,.92)'),
        'color:' + (fav ? '#FFFFFF' : '#8a8776'),
        'box-shadow:0 2px 8px rgba(45,58,46,.12)',
        'transition:background .2s, color .2s, border-color .2s, transform .2s',
      ].join('; ') + ';',
      favClass: 'ek-fav' + (fav ? ' is-on' : ''),
      favTitle: fav ? 'Odebrat z oblíbených' : 'Přidat do oblíbených',
      favIcon: this.mask(fav ? 'favourite-filled' : 'favourite', 20),
      toggleFav: (e) => {
        e.preventDefault(); e.stopPropagation();
        const id = this.props.title ?? 'Levandulové máslo, 100 g';
        const store = this.favStore();
        const next = !fav;
        if (next) store.add(id); else store.delete(id);
        this.setState({ fav: next });
        window.dispatchEvent(new CustomEvent('ek-fav-change', { detail: { count: store.size } }));
      },
    };
  }
}
</script>
</body>
</html>
