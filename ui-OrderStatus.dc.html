<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
</helmet>

<span style="{{ wrapStyle }}" title="{{ hint }}">
  <span style="{{ iconStyle }}"></span>
  <span>{{ label }}</span>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:56},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;new&quot;,&quot;waiting&quot;,&quot;packing&quot;,&quot;sent&quot;,&quot;delivered&quot;,&quot;returned&quot;,&quot;cancelled&quot;],&quot;default&quot;:&quot;delivered&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:13,&quot;min&quot;:11,&quot;max&quot;:18,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;plain&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  mask(name, size, color) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    return `display:inline-block; width:${size}px; height:${size}px; flex:0 0 auto; background-color:${color}; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`;
  }

  // Stavy objednávky navazují na semantickou škálu skladovosti — stejná logika barev.
  static STATES = {
    new:       { color: '#856512', icon: 'note-01',              label: 'Přijato',        hint: 'Objednávku jsme přijali, začínáme ji připravovat.' },
    packing:   { color: '#57712D', icon: 'package-open',         label: 'Připravujeme',   hint: 'Objednávku právě chystáme k odeslání.' },
    sent:      { color: '#3F7F2C', icon: 'truck-delivery',       label: 'Odesláno',       hint: 'Objednávka je na cestě k vám.' },
    delivered: { color: '#4C653D', icon: 'checkmark-circle-01',  label: 'Doručeno',       hint: 'Objednávka byla doručena a vyřízena.' },
    waiting:   { color: '#8A5A28', icon: 'clock-01',             label: 'Čeká na platbu', hint: 'Čekáme na připsání platby na náš účet.' },
    returned:  { color: '#A33203', icon: 'delivery-return-01',   label: 'Vráceno',        hint: 'Zboží se k nám vrátilo, řešíme s vámi další postup.' },
    cancelled: { color: '#8A2412', icon: 'minus-sign-circle',    label: 'Stornováno',     hint: 'Objednávka byla stornována.' },
  };

  renderVals() {
    const key = this.props.state ?? 'delivered';
    const s = Component.STATES[key] || Component.STATES.delivered;
    const size = Number(this.props.size ?? 13);
    const plain = this.props.plain === true;
    const rgb = [1, 3, 5].map(i => parseInt(s.color.substr(i, 2), 16)).join(',');

    return {
      label: s.label,
      hint: s.hint,
      iconStyle: this.mask(s.icon, Math.round(size * 1.2), s.color),
      wrapStyle: 'display:inline-flex; align-items:center; gap:7px; font-family:\'Work Sans\',sans-serif; font-weight:600; line-height:1.3; white-space:nowrap;'
        + ' font-size:' + size + 'px; color:' + s.color + ';'
        + (plain ? '' : ' padding:' + Math.round(size * 0.42) + 'px ' + Math.round(size * 0.78) + 'px; border-radius:999px;'
            + ' background:rgba(' + rgb + ',.10); border:1px solid rgba(' + rgb + ',.32);'),
    };
  }
}
</script>
</body>
</html>
