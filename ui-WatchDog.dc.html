<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  .ek-wd-in { width: 100%; height: 50px; padding: 0 16px; border: 1.5px solid #CFC4AA; border-radius: 12px; background: #fff; font-family: 'Work Sans',sans-serif; font-size: 15.5px; color: #2A2A24; outline: none; transition: border-color .18s, box-shadow .18s; }
  .ek-wd-in:focus { border-color: #4C653D; box-shadow: 0 0 0 3px rgba(76,101,61,.14); }
  .ek-wd-in::placeholder { color: #9b9888; }
  .ek-wd-main:hover { background: #B23803 !important; border-color: #B23803 !important; }
  .ek-wd-ghost:hover { background: #EFE7D6 !important; }
/* mobil: typografie modalů */
  @media (max-width: 900px) {
    .ek-mh { font-size: 25px !important; line-height: 1.2 !important; }
    .ek-mp { font-size: 15.5px !important; line-height: 1.5 !important; }
  }
</style>
</helmet>

<div style="{{ wrapStyle }}">
  <div style="display:flex; align-items:flex-start; gap:13px;">
    <span style="{{ iconWrap }}"><span style="{{ iconBell }}"></span></span>
    <div style="display:flex; flex-direction:column; gap:5px; min-width:0;">
      <span style="font-family:'EB Garamond',serif; font-weight:500; font-size:22px; line-height:1.2; color:#2D3A2E;" class="ek-mh">{{ heading }}</span>
      <p class="ek-mp" style="margin:0; font-size:14.5px; line-height:1.6; color:#52524a;">{{ intro }}</p>
    </div>
  </div>

  <sc-if value="{{ isForm }}" hint-placeholder-val="{{ true }}">
    <form onSubmit="{{ submit }}" style="display:flex; flex-direction:column; gap:12px;">
      <label style="display:flex; flex-direction:column; gap:6px;">
        <span style="display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:13px; font-weight:600; color:#4A4A42;">
          <span>Váš e-mail</span>
          <sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ false }}">
            <span style="font-size:12.5px; font-weight:500; color:#4C653D;">z vašeho účtu</span>
          </sc-if>
        </span>
        <input type="email" value="{{ email }}" onInput="{{ onEmail }}" placeholder="jmeno@example.cz" required="{{ true }}" autoComplete="email" class="ek-wd-in">
      </label>
      <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
        <span style="display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; color:#A33203;"><span style="{{ iconAlert }}"></span>{{ error }}</span>
      </sc-if>
      <div style="display:flex; align-items:center; gap:11px; flex-wrap:wrap;">
        <button type="submit" class="ek-wd-main" style="display:inline-flex; align-items:center; gap:9px; background:#D14405; color:#fff; border:1.5px solid #D14405; border-radius:999px; padding:13px 24px; font-family:'Work Sans',sans-serif; font-size:15.5px; font-weight:600; cursor:pointer; transition:background .2s, border-color .2s;">{{ submitLabel }}</button>
        <sc-if value="{{ hasCancel }}" hint-placeholder-val="{{ false }}">
          <button type="button" onClick="{{ cancel }}" class="ek-wd-ghost" style="background:transparent; border:1.5px solid transparent; border-radius:999px; padding:13px 18px; font-family:'Work Sans',sans-serif; font-size:15px; font-weight:600; color:#4C653D; cursor:pointer; transition:background .2s;">Zavřít</button>
        </sc-if>
      </div>
      <p style="margin:0; font-size:12.5px; line-height:1.55; color:#8a8776;">{{ consent }}</p>
    </form>
  </sc-if>

  <sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex; flex-direction:column; gap:12px;">
      <span style="display:flex; align-items:center; gap:9px; font-size:15.5px; font-weight:600; color:#3F7F2C;"><span style="{{ iconOk }}"></span>Hlídáme za vás</span>
      <p style="margin:0; font-size:14.5px; line-height:1.6; color:#52524a;">{{ doneNote }}</p>
      <div style="display:flex; align-items:center; gap:11px; flex-wrap:wrap;">
        <sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ false }}">
          <a href="#" style="display:inline-flex; align-items:center; gap:8px; font-size:14.5px; font-weight:600; color:#4C653D; text-decoration:none; border-bottom:1px solid rgba(76,101,61,.4); padding-bottom:2px;">Přehled hlídaných produktů</a>
        </sc-if>
        <button type="button" onClick="{{ undo }}" class="ek-wd-ghost" style="background:transparent; border:1.5px solid transparent; border-radius:999px; padding:11px 16px; font-family:'Work Sans',sans-serif; font-size:14.5px; font-weight:600; color:#6B6B5E; cursor:pointer; transition:background .2s;">Zrušit hlídání</button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:380},&quot;productName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Kyselina citronová monohydrát&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variantLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;25 kg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;loggedIn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;accountEmail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;anezka.drtinova@email.cz&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;boxed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;onSubmit&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;(email: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { email: null, sent: false, error: '' };

  mask(name, size, color) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    return `display:inline-block; width:${size}px; height:${size}px; flex:0 0 auto; background-color:${color}; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`;
  }

  renderVals() {
    const loggedIn = this.props.loggedIn ?? false;
    const accountEmail = this.props.accountEmail ?? 'anezka.drtinova@email.cz';
    const productName = this.props.productName ?? 'tento produkt';
    const variantLabel = this.props.variantLabel ?? '';
    const boxed = this.props.boxed !== false;
    const onClose = this.props.onClose;
    const email = this.state.email !== null ? this.state.email : (loggedIn ? accountEmail : '');
    const what = variantLabel ? productName + ' — ' + variantLabel : productName;

    return {
      loggedIn,
      email,
      heading: this.state.sent ? 'Naskladnění vám oznámíme' : 'Hlídací pes',
      intro: this.state.sent
        ? 'Jedno oznámení, žádný další newsletter.'
        : (loggedIn
            ? 'Napíšeme vám e-mail, jakmile ' + what + ' naskladníme. Adresu máte z účtu, stačí potvrdit.'
            : 'Napíšeme vám e-mail, jakmile ' + what + ' naskladníme. Nic jiného vám posílat nebudeme.'),
      isForm: !this.state.sent,
      isDone: this.state.sent,
      submitLabel: loggedIn ? 'Hlídat naskladnění' : 'Chci vědět o naskladnění',
      consent: 'E-mail použijeme jen k tomuto jednomu oznámení. Hlídání můžete kdykoli zrušit odkazem v e-mailu.',
      doneNote: 'Hlídáme ' + what + ' na adrese ' + email + '. Napíšeme vám v den, kdy bude zboží zpět na skladu.',
      hasError: !!this.state.error,
      error: this.state.error,
      hasCancel: !!onClose,
      cancel: () => { if (onClose) onClose(); },
      undo: () => this.setState({ sent: false }),
      onEmail: (e) => this.setState({ email: e.target.value, error: '' }),
      submit: (e) => {
        e.preventDefault();
        const val = (email || '').trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(val)) {
          this.setState({ error: 'Zadejte prosím e-mail ve tvaru jmeno@example.cz.' });
          return;
        }
        this.setState({ sent: true, error: '' });
        if (this.props.onSubmit) this.props.onSubmit(val);
      },
      iconBell: this.mask('notification-01', 22, '#4C653D'),
      iconAlert: this.mask('alert-circle', 17, '#A33203'),
      iconOk: this.mask('checkmark-circle-01', 20, '#3F7F2C'),
      iconWrap: 'display:flex; align-items:center; justify-content:center; width:44px; height:44px; flex:0 0 auto; border-radius:12px; background:#F4F7EA; border:1px solid rgba(76,101,61,.18);',
      wrapStyle: 'display:flex; flex-direction:column; gap:18px; font-family:\'Work Sans\',sans-serif;'
        + (boxed ? ' padding:22px; background:#fff; border:1px solid #E4DAC6; border-radius:14px;' : ''),
    };
  }
}
</script>
</body>
</html>
