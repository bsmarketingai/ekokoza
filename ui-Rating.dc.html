<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="{{ wrapStyle }}" title="{{ hint }}" aria-label="{{ hint }}">
  <span style="display:inline-flex; gap:2px; flex:0 0 auto;">
    <sc-for list="{{ stars }}" as="s" hint-placeholder-count="5">
      <span style="{{ s.host }}">
        <span style="{{ s.track }}"></span>
        <span style="{{ s.fill }}"></span>
      </span>
    </sc-for>
  </span>
  <sc-if value="{{ hasText }}" hint-placeholder-val="{{ true }}">
    <span style="{{ textStyle }}">{{ text }}</span>
  </sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:70},&quot;value&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:4.75,&quot;min&quot;:0,&quot;max&quot;:5,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:128,&quot;min&quot;:0,&quot;max&quot;:9999,&quot;tsType&quot;:&quot;number&quot;},&quot;showValue&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showCount&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;countLabel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:14,&quot;min&quot;:10,&quot;max&quot;:34,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#B8860B&quot;,&quot;options&quot;:[&quot;#B8860B&quot;,&quot;#F5C63C&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;textColor&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;trackColor&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  mask(size, color, extra) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/star-filled.svg';
    return `display:block; width:${size}px; height:${size}px; background-color:${color};`
      + ` -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`
      + (extra || '');
  }

  renderVals() {
    const value = Math.max(0, Math.min(5, Number(this.props.value ?? 4.5)));
    const count = Number(this.props.count ?? 0);
    const size = Number(this.props.size ?? 14);
    const fill = this.props.color ?? '#B8860B';
    const track = this.props.trackColor ?? 'rgba(184,134,11,.24)';
    const empty = count === 0 && !this.props.value;
    const showValue = this.props.showValue !== false;
    const showCount = this.props.showCount !== false;
    const countLabel = this.props.countLabel !== false;

    // Částečná výplň na procenta: spodní hvězda v tlumené barvě, přes ni zlatá výseč
    const stars = [0, 1, 2, 3, 4].map(i => {
      const pct = empty ? 0 : Math.max(0, Math.min(1, value - i)) * 100;
      return {
        host: `position:relative; display:block; width:${size}px; height:${size}px; flex:0 0 auto;`,
        track: this.mask(size, track),
        fill: this.mask(size, fill, ` position:absolute; inset:0; clip-path:inset(0 ${(100 - pct).toFixed(2)}% 0 0);`),
      };
    });

    // Jeden zápis pro celý web: 4,8 · 128 hodnocení
    const valueText = value.toLocaleString('cs-CZ', { maximumFractionDigits: 2 });
    const countText = count.toLocaleString('cs-CZ') + (countLabel ? ' hodnocení' : '');
    const parts = [];
    if (showValue) parts.push(valueText);
    if (showCount && count > 0) parts.push(countText);
    const text = empty ? 'Bez hodnocení' : parts.join(' · ');

    const textSize = Math.max(12.5, Math.round(size * 0.92 * 10) / 10);

    return {
      stars,
      text,
      hasText: !!text,
      hint: empty ? 'Produkt zatím nemá hodnocení' : valueText + ' z 5 · ' + count.toLocaleString('cs-CZ') + ' hodnocení',
      textStyle: 'font-family:\'Work Sans\',sans-serif; font-weight:500; font-size:' + textSize + 'px; line-height:1.3; white-space:nowrap; color:'
        + (this.props.textColor ?? (empty ? '#8a8776' : '#4A4A42')) + ';',
      wrapStyle: 'display:inline-flex; align-items:center; gap:7px; min-height:' + (size + 4) + 'px; font-family:\'Work Sans\',sans-serif;',
    };
  }
}
</script>
</body>
</html>
