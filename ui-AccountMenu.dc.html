<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  .ek-acc-item:hover { background: #F4F7EA; color: #4C653D !important; }
  .ek-acc-item:hover .ek-acc-ico { opacity: 1; }
  .ek-acc-out:hover { background: #FBF0EA; color: #B23803 !important; }
</style>
</helmet>

<div style="{{ wrapStyle }}">
  <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:16px 18px 14px; background:#FFFFFF; border-bottom:1px solid #EFE7D6;">
    <div style="display:flex; flex-direction:column; gap:6px; min-width:0;">
      <span style="font-family:'EB Garamond',serif; font-weight:500; font-size:21px; line-height:1.15; color:#4C653D; overflow:hidden; text-overflow:ellipsis;">{{ name }}</span>
      <dc-import name="ui-LoyaltyStatus" variant="compact" turnover="{{ turnover }}" showScale="{{ false }}" hint-size="100%,84px"></dc-import>
    </div>
    <button onClick="{{ close }}" aria-label="Zavřít" style="display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; flex:0 0 auto; border-radius:50%; background:transparent; border:1px solid rgba(76,101,61,.22); cursor:pointer;"><span style="{{ iconClose }}"></span></button>
  </div>

  <nav style="display:flex; flex-direction:column; gap:2px; padding:7px;">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
      <a href="{{ it.href }}" class="ek-acc-item" style="{{ it.style }}">
        <span class="ek-acc-ico" style="{{ it.icon }}"></span>{{ it.label }}
      </a>
    </sc-for>
    <span style="height:1px; margin:6px 12px; background:rgba(76,101,61,.16);"></span>
    <a href="{{ logoutHref }}" class="ek-acc-out" style="display:flex; align-items:center; gap:10px; padding:8px 12px; min-height:38px; border-radius:9px; text-decoration:none; font-family:'Work Sans',sans-serif; font-size:14.5px; font-weight:600; color:#A33203; transition:background .15s, color .15s;">
      <span style="{{ iconLogout }}"></span>Odhlásit z e-shopu
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:420},&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Anežka Drtinová&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;turnover&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:7400,&quot;min&quot;:0,&quot;max&quot;:60000,&quot;step&quot;:100,&quot;unit&quot;:&quot;Kč&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;priceGroup&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Registrovaný zákazník&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;floating&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;logoutHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  mask(name, size, color, extra) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    return `display:inline-block; width:${size}px; height:${size}px; flex:0 0 auto; background-color:${color};`
      + ` -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;` + (extra || '');
  }

  renderVals() {
    const ITEMS = [
      ['Můj účet — přehled', 'muj-ucet.html', 'dashboard-speed-01'],
      ['Přehled objednávek', 'objednavky.html', 'delivery-box-01'],
      ['Přehled faktur', 'faktury.html', 'invoice-01'],
      ['Oblíbené produkty', 'oblibene.html', 'favourite'],
      ['Správa účtu', 'ucet.html', 'user-circle'],
    ];
    return {
      name: this.props.name ?? 'Anežka Drtinová',
      priceGroup: this.props.priceGroup ?? 'Registrovaný zákazník',
      turnover: Number(this.props.turnover ?? 7400),
      logoutHref: this.props.logoutHref ?? '#',
      close: () => { if (this.props.onClose) this.props.onClose(); },
      items: ITEMS.map(([label, href, icon]) => ({
        label, href,
        icon: this.mask(icon, 20, '#4C653D', ' opacity:.72; transition:opacity .15s;'),
        style: 'display:flex; align-items:center; gap:10px; padding:8px 12px; min-height:38px; border-radius:9px; text-decoration:none;'
          + " font-family:'Work Sans',sans-serif; font-size:14.5px; font-weight:500; color:#2A2A24; transition:background .15s, color .15s;",
      })),
      iconClose: this.mask('cancel-01', 18, '#4C653D'),
      iconLogout: this.mask('logout-01', 20, '#A33203'),
      wrapStyle: 'width:min(340px, calc(100vw - 32px)); background:#FFFFFF; border:1px solid #E4DAC6; border-radius:14px; overflow:hidden;'
        + ' box-shadow:0 26px 54px -26px rgba(45,58,46,.5); font-family:\'Work Sans\',sans-serif;'
        + (this.props.floating === false ? '' : ' position:absolute; top:calc(100% + 14px); right:0; z-index:80;'),
    };
  }
}
</script>
</body>
</html>
