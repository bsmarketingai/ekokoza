<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .ek-car-rail { display: flex; gap: 20px; overflow-x: auto; scroll-behavior: smooth; scroll-snap-type: x mandatory; padding: 4px 2px 10px; scrollbar-width: thin; scrollbar-color: #cdbfa3 transparent; }
  .ek-car-rail::-webkit-scrollbar { height: 8px; }
  .ek-car-rail::-webkit-scrollbar-thumb { background: #cdbfa3; border-radius: 8px; }
  .ek-car-rail > * { scroll-snap-align: start; flex: 0 0 264px; }
  .ek-car-a { width: 46px; height: 46px; border-radius: 50%; border: 1.5px solid #CFC4AA; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .2s, border-color .2s; }
  .ek-car-a:hover { background: #4C653D; border-color: #4C653D; }
  .ek-car-a:hover span { background-color: #F6F1E7 !important; }
  @media (max-width: 700px) { .ek-car-rail > * { flex: 0 0 76%; } .ek-car-arrows { display: none !important; } }
</style>
</helmet>
<section style="display:flex; flex-direction:column; gap:18px; font-family:'Work Sans',sans-serif;">
  <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;">
    <div style="display:flex; flex-direction:column; gap:6px; min-width:0;">
      <h2 style="margin:0; font-family:'EB Garamond',serif; font-weight:500; font-size:30px; line-height:1.15; color:#2D3A2E; text-wrap:pretty;">{{ title }}</h2>
      <p style="margin:0; font-size:15.5px; line-height:1.6; color:#52524a; max-width:60ch;">{{ subtitle }}</p>
    </div>
    <div class="ek-car-arrows" style="display:flex; gap:10px; flex:0 0 auto;">
      <button onClick="{{ prev }}" class="ek-car-a" title="Předchozí" aria-label="Předchozí"><span style="{{ iconPrev }}"></span></button>
      <button onClick="{{ next }}" class="ek-car-a" title="Další" aria-label="Další"><span style="{{ iconNext }}"></span></button>
    </div>
  </div>

  <div ref="{{ rail }}" class="ek-car-rail">
    <sc-for list="{{ items }}" as="p" hint-placeholder-count="4">
      <dc-import name="ui-ProductCard" title="{{ p.title }}" price="{{ p.price }}" img="{{ p.img }}" href="{{ p.href }}" rating="{{ p.rating }}" ratingCount="{{ p.ratingCount }}" stockState="{{ p.stockState }}" stockDate="{{ p.stockDate }}" ctaVariant="{{ p.ctaVariant }}" badge="{{ p.badge }}" hint-size="264px,420px"></dc-import>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nepotřebujete dokoupit i toto?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Suroviny a pomůcky, které se k tomuto produktu nejčastěji přidávají.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;}}">
class Component extends DCLogic {
  rail = React.createRef();

  mask(name, size, color) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    return `display:inline-block; width:${size}px; height:${size}px; background-color:${color}; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat; transition:background-color .2s;`;
  }

  slide(dir) {
    const el = this.rail.current;
    if (!el) return;
    el.scrollBy({ left: dir * Math.max(284, el.clientWidth * 0.8), behavior: 'smooth' });
  }

  renderVals() {
    return {
      title: this.props.title ?? 'Nepotřebujete dokoupit i toto?',
      subtitle: this.props.subtitle ?? 'Suroviny a pomůcky, které se k tomuto produktu nejčastěji přidávají.',
      items: this.props.items ?? [],
      rail: this.rail,
      prev: () => this.slide(-1),
      next: () => this.slide(1),
      iconPrev: this.mask('arrow-left-01', 24, '#4C653D'),
      iconNext: this.mask('arrow-right-01', 24, '#4C653D'),
    };
  }
}
</script>
</body>
</html>
