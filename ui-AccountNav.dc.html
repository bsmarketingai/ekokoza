<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  .ek-anav { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .ek-anav::-webkit-scrollbar { display: none; }
  .ek-anav-i:hover { border-color: #4C653D; background: #FDFBF5; }
  .ek-anav-on:hover { background: #4C653D !important; }
  .ek-logout:hover { background: rgba(163,50,3,.1) !important; border-color: rgba(163,50,3,.5) !important; }
  @media (max-width: 760px) {
    .ek-anav-head { flex-direction: column !important; align-items: stretch !important; gap: 14px !important; }
    .ek-anav-head > a { margin-left: 0 !important; align-self: flex-start; }
  }
  /* Na mobilu se položky zóny nescrollují, ale zalomí do mřížky — jinak uživatel nevidí, kam může jít */
  @media (max-width: 760px) {
    .ek-anav { display: grid !important; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; overflow: visible !important; }
    .ek-anav-i { justify-content: flex-start; padding: 12px 14px !important; font-size: 14px !important; }
  }
  @media (max-width: 380px) { .ek-anav { grid-template-columns: 1fr !important; } }
</style>
</helmet>

<div style="display:flex; flex-direction:column; gap:14px; font-family:'Work Sans',sans-serif;">
  <div class="ek-anav-head" style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:16px 20px; border:1px solid #E4DAC6; border-radius:14px; background:linear-gradient(160deg,#FCFAF3 0%,#EEF4DC 100%);">
    <span style="display:flex; flex-direction:column; gap:7px; min-width:0;">
      <span style="font-family:'EB Garamond',serif; font-weight:500; font-size:22px; line-height:1.15; color:#2D3A2E;">{{ name }}</span>
      <span style="display:block; width:100%; max-width:420px;">
        <dc-import name="ui-LoyaltyStatus" variant="compact" turnover="{{ turnover }}" showScale="{{ false }}" hint-size="100%,72px"></dc-import>
      </span>
    </span>
    <a href="#" class="ek-logout" style="margin-left:auto; display:inline-flex; align-items:center; gap:8px; padding:9px 15px; min-height:38px; border-radius:999px; border:1.5px solid rgba(163,50,3,.28); background:rgba(163,50,3,.05); font-size:14px; font-weight:600; color:#A33203; text-decoration:none; white-space:nowrap; transition:background .2s, border-color .2s;">
      <span style="{{ iconLogout }}"></span>Odhlásit z e-shopu
    </a>
  </div>

  <nav class="ek-anav" aria-label="Zákaznická zóna">
    <sc-for list="{{ items }}" as="it" hint-placeholder-count="4">
      <a href="{{ it.href }}" class="{{ it.cls }}" style="{{ it.style }}">
        <span style="{{ it.icon }}"></span>{{ it.label }}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:170},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;objednavky&quot;,&quot;faktury&quot;,&quot;oblibene&quot;,&quot;ucet&quot;],&quot;default&quot;:&quot;objednavky&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Anežka Drtinová&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;turnover&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12400,&quot;min&quot;:0,&quot;max&quot;:60000,&quot;step&quot;:100,&quot;unit&quot;:&quot;Kč&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;priceGroup&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Registrovaný zákazník&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  mask(name, size, color) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    return `display:inline-block; width:${size}px; height:${size}px; flex:0 0 auto; background-color:${color}; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`;
  }

  renderVals() {
    const active = this.props.active ?? 'objednavky';
    const name = this.props.name ?? 'Anežka Drtinová';
    const ITEMS = [
      ['dashboard', 'Přehled', 'muj-ucet.html', 'dashboard-speed-01'],
      ['objednavky', 'Přehled objednávek', 'objednavky.html', 'delivery-box-01'],
      ['faktury', 'Přehled faktur', 'faktury.html', 'invoice-01'],
      ['oblibene', 'Oblíbené produkty', 'oblibene.html', 'favourite'],
      ['ucet', 'Správa účtu', 'ucet.html', 'user-circle'],
    ];
    return {
      name,
      priceGroup: this.props.priceGroup ?? 'Registrovaný zákazník',
      turnover: Number(this.props.turnover ?? 12400),

      iconLogout: this.mask('logout-01', 18, '#A33203'),
      items: ITEMS.map(([key, label, href, icon]) => {
        const on = key === active;
        return {
          label, href,
          cls: on ? 'ek-anav-i ek-anav-on' : 'ek-anav-i',
          icon: this.mask(icon, 19, on ? '#F6F1E7' : '#4C653D'),
          style: 'display:inline-flex; align-items:center; gap:9px; white-space:nowrap; padding:11px 18px; min-height:44px; border-radius:999px; text-decoration:none;'
            + " font-family:'Work Sans',sans-serif; font-size:14.5px; font-weight:600; transition:background .2s, border-color .2s, color .2s;"
            + (on ? ' background:#4C653D; border:1.5px solid #4C653D; color:#F6F1E7;' : ' background:#fff; border:1.5px solid #E2D9C4; color:#2A2A24;'),
        };
      }),
    };
  }
}
</script>
</body>
</html>
