<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .ek-g-main { border: none; padding: 0; cursor: zoom-in; display: block; width: 100%; }
  .ek-g-th { border: 1.5px solid #ECE3D2; padding: 0; cursor: pointer; border-radius: 10px; transition: border-color .2s, transform .2s; }
  .ek-g-th:hover { border-color: #4C643C; transform: translateY(-2px); }
</style>
</helmet>
<div style="display:flex; flex-direction:column; gap:14px; font-family:'Hanken Grotesk',sans-serif;">
  <div style="position:relative; border:1px solid #ECE3D2; border-radius:14px; overflow:hidden; background:#fff;">
    <button onClick="{{ openZoom }}" class="ek-g-main" title="Zvětšit fotografii" style="{{ mainStyle }}"></button>
    <span style="position:absolute; top:16px; left:16px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; z-index:2; pointer-events:none;">
      <sc-for list="{{ badges }}" as="b" hint-placeholder-count="2">
        <dc-import name="ui-Badge" variant="{{ b.variant }}" label="{{ b.label }}" hint-size="100px,26px"></dc-import>
      </sc-for>
    </span>
    <span aria-hidden="true" style="position:absolute; right:14px; bottom:14px; display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.94); border:1px solid #ECE3D2; border-radius:999px; padding:8px 14px; font-size:12.5px; font-weight:600; color:#3B5531; pointer-events:none;"><span style="{{ iconZoom }}"></span>Zvětšit</span>
  </div>

  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="4">
      <button onClick="{{ t.select }}" class="ek-g-th" title="{{ t.alt }}" style="{{ t.style }}"></button>
    </sc-for>
  </div>

  <p style="margin:0; font-size:13px; line-height:1.5; color:#6B6B5E; font-style:italic;">{{ note }}</p>

  <sc-if value="{{ zoom }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeZoom }}" style="position:fixed; inset:0; z-index:300; background:rgba(34,48,31,.86); display:flex; align-items:center; justify-content:center; padding:28px; cursor:zoom-out;">
      <div style="{{ zoomStyle }}"></div>
      <span style="position:absolute; top:22px; right:24px; display:flex; align-items:center; gap:8px; color:#F6F1E7; font-size:14px; font-weight:600;"><span style="{{ iconClose }}"></span>Zavřít</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:680},&quot;images&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{src:string, alt?:string}[]&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Obrázek je pouze ilustrační.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badges&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(string|{variant:string,label?:string})[]&quot;}}">
class Component extends DCLogic {
  state = { i: 0, zoom: false };

  mask(name, size, color) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    return `display:inline-block; width:${size}px; height:${size}px; flex:0 0 auto; background-color:${color}; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`;
  }

  componentDidMount() {
    this.esc = (e) => { if (e.key === 'Escape') this.setState({ zoom: false }); };
    window.addEventListener('keydown', this.esc);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.esc); }

  renderVals() {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = (src) => (/^(https?:|\/|\.\.|data:)/.test(src) ? src : base + src);
    const images = this.props.images ?? [
      { src: 'assets/products/kyselina-citronova-1-kg.webp', alt: 'Kyselina citronová 1 kg v papírovém sáčku' },
      { src: 'assets/products/mydlova-hmota-bambucke-maslo-1-kg.jpg', alt: 'Balení zblízka' },
      { src: 'assets/products/stabilizovany-vitamin-c-10-g.jpg', alt: 'Detail krystalů' },
    ];
    const i = Math.min(this.state.i, images.length - 1);
    const active = images[i] || images[0];

    return {
      note: this.props.note ?? 'Obrázek je pouze ilustrační.',
      badges: (this.props.badges ?? []).map(b => (typeof b === 'string' ? { variant: b, label: '' } : { variant: b.variant, label: b.label ?? '' })),
      zoom: this.state.zoom,
      openZoom: () => this.setState({ zoom: true }),
      closeZoom: () => this.setState({ zoom: false }),
      mainStyle: 'aspect-ratio:1/1; background:#fff center/contain no-repeat; background-image:url("' + url(active.src) + '");',
      zoomStyle: 'width:min(820px,92vw,84vh); max-width:92vw; max-height:84vh; aspect-ratio:1/1; border-radius:16px; background:#fff center/contain no-repeat; background-image:url("' + url(active.src) + '");',
      thumbs: images.map((im, idx) => ({
        alt: im.alt || '',
        select: () => this.setState({ i: idx }),
        style: 'width:78px; height:78px; background:#fff center/contain no-repeat; background-image:url("' + url(im.src) + '");'
          + (idx === i ? ' border-color:#4C643C; box-shadow:0 0 0 2px rgba(76,100,60,.22);' : ''),
      })),
      iconZoom: this.mask('search-01', 24, '#3B5531'),
      iconClose: this.mask('cancel-01', 24, '#F6F1E7'),
    };
  }
}
</script>
</body>
</html>
