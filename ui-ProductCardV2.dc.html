<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .ek-c2-t:hover { color: #B23803 !important; }
  .ek-c2:hover { border-color: #CFC4AA; box-shadow: 0 16px 34px -24px rgba(45,58,46,.45); }
  .ek-c2-var { font-family: 'Work Sans',sans-serif; font-size: 12.5px; font-weight: 600; padding: 7px 11px; min-height: 32px; border-radius: 999px; cursor: pointer; transition: background .18s, color .18s, border-color .18s; }
  .ek-c2-step { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex: 0 0 auto; border: none; background: transparent; cursor: pointer; color: #4C653D; }
  .ek-c2-step:disabled { opacity: .35; cursor: default; }
  .ek-c2-buy:hover { background: #B23803 !important; border-color: #B23803 !important; }
</style>
</helmet>

<div class="ek-c2" style="display:flex; flex-direction:column; background:#fff; border:1px solid #ECE3D2; border-radius:14px; overflow:hidden; transition:border-color .25s, box-shadow .25s; font-family:'Work Sans',sans-serif;">

  <div style="position:relative; aspect-ratio:1/1; background:#fff;">
    <a href="{{ href }}" title="{{ title }}" style="position:absolute; inset:0; z-index:1; display:block; text-decoration:none;"></a>
    <div style="{{ imgStyle }}"></div>
    <sc-if value="{{ badge }}" hint-placeholder-val="{{ true }}">
      <span style="position:absolute; top:12px; left:12px; z-index:2;">
        <dc-import name="ui-Badge" variant="{{ badge }}" label="{{ badgeLabel }}" hint-size="90px,24px"></dc-import>
      </span>
    </sc-if>
    <button onClick="{{ toggleFav }}" class="{{ favClass }}" title="{{ favTitle }}" style="{{ favStyle }}">
      <span style="{{ favIcon }}"></span>
    </button>
  </div>

  <div style="padding:15px 15px 16px; display:flex; flex-direction:column; gap:9px; flex:1;">
    <dc-import name="ui-Rating" compact="{{ true }}" value="{{ rating }}" count="{{ ratingCount }}" hint-size="120px,18px"></dc-import>
    <h3 style="margin:0; font-family:'EB Garamond',serif; font-weight:500; font-size:18px; line-height:1.25;"><a href="{{ href }}" class="ek-c2-t" style="color:#2A2A24; text-decoration:none;">{{ title }}</a></h3>

    <dc-import name="ui-Stock" state="{{ stockState }}" date="{{ stockDate }}" size="{{ 13 }}" hint-size="140px,18px"></dc-import>

    <div style="display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; margin-top:auto; padding-top:4px;">
      <span style="font-family:'EB Garamond',serif; font-size:22px; font-weight:500; color:#4C653D; white-space:nowrap;">{{ price }}</span>
      <sc-if value="{{ showPriceOrig }}" hint-placeholder-val="{{ false }}">
        <span style="font-size:12.5px; color:#6B6B5E; text-decoration:line-through; white-space:nowrap;">{{ priceOrigLabel }}</span>
      </sc-if>
      <span style="font-size:12.5px; color:#6B6B5E; white-space:nowrap;">{{ unitPrice }}</span>
    </div>

    <sc-if value="{{ showLoyalty }}" hint-placeholder-val="{{ true }}">
      <span style="{{ loyaltyStyle }}">
        <span style="{{ loyaltyIcon }}"></span>
        <span style="min-width:0;">{{ loyaltyText }}</span>
      </span>
    </sc-if>

    <sc-if value="{{ isVariant }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:3px;">
        <sc-for list="{{ variants }}" as="v" hint-placeholder-count="3">
          <button onClick="{{ v.pick }}" title="{{ v.title }}" class="ek-c2-var" style="{{ v.style }}">{{ v.label }}</button>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ isSingle }}" hint-placeholder-val="{{ false }}">
      <div style="height:32px; margin-top:3px;"></div>
    </sc-if>

    <sc-if value="{{ buyable }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="display:flex; align-items:center; flex:0 0 auto; border:1.5px solid #CFC4AA; border-radius:999px; background:#fff;">
          <button onClick="{{ dec }}" disabled="{{ atMin }}" class="ek-c2-step" aria-label="Ubrat kus"><span style="{{ iconMinus }}"></span></button>
          <span style="min-width:22px; text-align:center; font-size:14.5px; font-weight:600; color:#2A2A24;">{{ qty }}</span>
          <button onClick="{{ inc }}" class="ek-c2-step" aria-label="Přidat kus"><span style="{{ iconPlus }}"></span></button>
        </span>
        <button onClick="{{ addToCart }}" class="ek-c2-buy" style="flex:1; min-width:0; display:flex; align-items:center; justify-content:center; gap:7px; height:38px; padding:0 12px; border:1.5px solid #D14405; border-radius:999px; background:#D14405; color:#fff; font-family:'Work Sans',sans-serif; font-size:13.5px; font-weight:600; cursor:pointer; transition:background .2s, border-color .2s; white-space:nowrap;"><span style="{{ iconCart }}"></span>{{ ctaLabel }}</button>
      </div>
    </sc-if>

    <sc-if value="{{ notBuyable }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex; flex-direction:column; gap:8px; margin-top:3px;">
        <span style="font-size:13px; color:#6B6B5E;">Tento produkt nelze zakoupit</span>
        <a href="{{ watchHref }}" style="display:flex; align-items:center; justify-content:center; gap:8px; height:38px; border:1.5px solid #4C653D; color:#4C653D; text-decoration:none; border-radius:999px; font-weight:600; font-size:13.5px;" style-hover="background:#EFE7D6"><span style="{{ iconWatch }}"></span>Hlídací pes</a>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:520},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Levandulové máslo&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Obsah&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;189 Kč&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Obsah&quot;},&quot;pack&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;100 g&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Obsah&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/products/levandulove-maslo-100-g.jpg&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Obsah&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;produkt-vzor.html&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Obsah&quot;},&quot;variants&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;},&quot;ctaVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;koupit&quot;,&quot;varianta&quot;],&quot;default&quot;:&quot;varianta&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Akce&quot;},&quot;loggedIn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Cena&quot;},&quot;loyaltyTier&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:10,&quot;min&quot;:0,&quot;max&quot;:30,&quot;unit&quot;:&quot;%&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Cena&quot;},&quot;stockState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ready&quot;,&quot;packing&quot;,&quot;expected&quot;,&quot;onway&quot;,&quot;toorder&quot;,&quot;longterm&quot;,&quot;ended&quot;],&quot;default&quot;:&quot;ready&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Obsah&quot;},&quot;stockDate&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;28. 8. 2026&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Obsah&quot;},&quot;badge&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;bestseller&quot;,&quot;novinka&quot;,&quot;doporucujeme&quot;,&quot;prirodni&quot;,&quot;bio&quot;,&quot;sada&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Obsah&quot;},&quot;rating&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:4.6,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Obsah&quot;},&quot;ratingCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:84,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Obsah&quot;},&quot;fav&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { fav: null, sel: 0, qty: 1 };

  favStore() {
    if (!window.__ekFav) window.__ekFav = new Set();
    return window.__ekFav;
  }

  componentDidMount() {
    const id = this.props.title ?? '';
    if (this.props.fav) this.favStore().add(id);
    if (this.favStore().has(id)) {
      this.setState({ fav: true });
      window.dispatchEvent(new CustomEvent('ek-fav-change', { detail: { count: this.favStore().size } }));
    }
  }

  mask(name, size, color) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    return `display:inline-block; width:${size}px; height:${size}px; flex:0 0 auto; background-color:${color || 'currentColor'}; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`;
  }

  static czk(n) {
    return Math.round(n).toLocaleString('cs-CZ').replace(/\u00a0/g, ' ') + ' Kč';
  }

  // Jednotková cena — spočítá se z popisu balení („100 g“, „1 kg“, „600 ml“, „5 ks“)
  static unit(label, price) {
    if (!label) return '';
    const m = String(label).replace(',', '.').match(/([\d.]+)\s*(kg|g|l|ml|ks)/i);
    if (!m) return '';
    let amount = parseFloat(m[1]);
    const u = m[2].toLowerCase();
    if (u === 'ks') return Component.czk(price / amount) + ' / ks';
    if (u === 'g') return Component.czk(price / amount * 100) + ' / 100 g';
    if (u === 'kg') return Component.czk(price / amount) + ' / kg';
    if (u === 'ml') return Component.czk(price / amount * 100) + ' / 100 ml';
    return Component.czk(price / amount) + ' / l';
  }

  renderVals() {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const img = this.props.img ?? 'assets/products/levandulove-maslo-100-g.jpg';
    const imgUrl = /^(https?:|\/|\.\.)/.test(img) ? img : base + img;

    const numFromPrice = (v) => {
      if (typeof v === 'number') return v;
      const n = parseFloat(String(v ?? '').replace(/[^\d,.]/g, '').replace(/\s/g, '').replace(',', '.'));
      return isNaN(n) ? 189 : n;
    };
    const basePrice = this.props.priceNum ?? numFromPrice(this.props.price);
    // balení: buď z propu, nebo odvozené z názvu produktu („…, 100 g“)
    const titleForPack = String(this.props.title ?? '');
    const packMatch = titleForPack.match(/(\d[\d\s]*(?:,\d+)?)\s*(kg|g|ml|l|ks)\b/i);
    const packLabel = this.props.pack ?? (packMatch ? packMatch[0].replace(/\s+/g, ' ') : '');

    // Varianty: buď přijdou z dat, nebo se dopočítají jako ukázka (balení × cena)
    const given = this.props.variants;
    const isVariant = Array.isArray(given) ? given.length > 1 : (this.props.ctaVariant ?? 'koupit') === 'varianta';
    // Ukázkové varianty: základní cena patří balení z názvu, větší balení mají poměrnou úsporu
    const pm = String(packLabel).replace(',', '.').match(/([\d.]+)\s*(kg|g|l|ml|ks)/i);
    const pAmount = pm ? parseFloat(pm[1]) : 1;
    const pUnit = pm ? pm[2].toLowerCase() : 'ks';
    const fmt = (n) => (Number.isInteger(n) ? n : n.toFixed(1).replace('.', ',')) + ' ' + pUnit;
    const auto = [
      { label: packLabel || '1 ks', price: basePrice, state: this.props.stockState ?? 'ready' },
      { label: fmt(pAmount * 5), price: Math.round(basePrice * 5 * 0.9), state: 'ready' },
      { label: fmt(pAmount * 10), price: Math.round(basePrice * 10 * 0.82), state: 'packing' },
    ];
    const list = (Array.isArray(given) && given.length ? given : (isVariant ? auto : [{ label: packLabel, price: basePrice, state: this.props.stockState ?? 'ready' }]))
      .map(v => ({ label: v.label ?? '', price: v.price ?? basePrice, state: v.state ?? 'ready' }));

    const sel = Math.min(this.state.sel, list.length - 1);
    const cur = list[sel] || list[0];
    const stockState = cur.state;
    const buyable = !['toorder', 'longterm', 'unavail', 'unavailable', 'ended', 'discontinued', 'out'].includes(stockState);

    const loggedIn = !!this.props.loggedIn;
    const tier = this.props.loyaltyTier ?? 10;
    const loyalPrice = cur.price * (1 - tier / 100);

    const varStyle = (on) => 'border:1px solid ' + (on ? '#4C653D' : '#E4DAC6') + '; background:' + (on ? '#4C653D' : '#fff') + '; color:' + (on ? '#F6F1E7' : '#4C653D') + ';';
    const fav = this.state.fav !== null ? this.state.fav : !!this.props.fav;
    const qty = this.state.qty;

    return {
      title: this.props.title ?? 'Levandulové máslo',
      href: this.props.href ?? 'produkt-vzor.html',
      badge: this.props.badge ?? '',
      badgeLabel: this.props.badgeLabel ?? '',
      rating: this.props.rating ?? 4.6,
      ratingCount: this.props.ratingCount ?? 84,
      stockState,
      stockDate: this.props.stockDate ?? '28. 8. 2026',
      buyable,
      notBuyable: !buyable,
      watchHref: this.props.watchHref ?? '#',
      isVariant: isVariant && list.length > 1,
      isSingle: !(isVariant && list.length > 1),
      variants: list.map((v, i) => ({
        label: v.label,
        title: v.label + ' — ' + Component.czk(v.price),
        style: varStyle(i === sel),
        pick: () => this.setState({ sel: i, qty: 1 }),
      })),
      price: Component.czk(loggedIn ? loyalPrice : cur.price),
      priceOrigLabel: 'běžně ' + Component.czk(cur.price),
      showPriceOrig: loggedIn,
      unitPrice: Component.unit(cur.label, loggedIn ? loyalPrice : cur.price),
      showLoyalty: buyable,
      loyaltyText: loggedIn
        ? 'Vaše sleva −' + tier + ' %'
        : 'Ve věrnostním programu ' + Component.czk(loyalPrice),
      loyaltyStyle: 'display:flex; align-items:center; gap:7px; padding:6px 9px; border-radius:10px; font-size:12px; font-weight:600; line-height:1.3; white-space:nowrap; overflow:hidden; '
        + (loggedIn
            ? 'background:#EEF4DC; border:1px solid rgba(76,101,61,.35); color:#4C653D;'
            : 'background:#FBF8F1; border:1px dashed #D8CDB4; color:#6B6B5E;'),
      loyaltyIcon: this.mask('percent-circle', 16, loggedIn ? '#4C653D' : '#8A5A28'),
      qty,
      atMin: qty <= 1,
      inc: () => this.setState({ qty: qty + 1 }),
      dec: () => this.setState({ qty: Math.max(1, qty - 1) }),
      iconMinus: this.mask('minus-sign', 15, '#4C653D'),
      iconPlus: this.mask('plus-sign', 15, '#4C653D'),
      iconCart: this.mask('shopping-cart-01', 17, '#FFFFFF'),
      iconWatch: this.mask('notification-01', 18, '#4C653D'),
      ctaLabel: 'Do košíku',
      addToCart: (e) => {
        e.preventDefault();
        window.dispatchEvent(new CustomEvent('ek-cart-add', { detail: { title: this.props.title, variant: cur.label, qty, price: cur.price } }));
        this.setState({ qty: 1 });
      },
      imgStyle: 'position:absolute; inset:14px; background:#fff center/contain no-repeat; background-image:url("' + imgUrl + '");',
      favStyle: [
        'position:absolute', 'top:10px', 'right:10px', 'z-index:2',
        'width:36px', 'height:36px', 'padding:0', 'border-radius:50%', 'cursor:pointer',
        'display:flex', 'align-items:center', 'justify-content:center',
        'border:1px solid ' + (fav ? '#D8763B' : '#ECE3D2'),
        'background:' + (fav ? '#D8763B' : 'rgba(255,255,255,.92)'),
        'color:' + (fav ? '#FFFFFF' : '#8a8776'),
        'box-shadow:0 2px 8px rgba(45,58,46,.12)',
        'transition:background .2s, color .2s, border-color .2s',
      ].join('; ') + ';',
      favClass: 'ek-fav' + (fav ? ' is-on' : ''),
      favTitle: fav ? 'Odebrat z oblíbených' : 'Přidat do oblíbených',
      favIcon: this.mask(fav ? 'favourite-filled' : 'favourite', 20),
      toggleFav: (e) => {
        e.preventDefault(); e.stopPropagation();
        const id = this.props.title ?? '';
        const store = this.favStore();
        const next = !fav;
        if (next) store.add(id); else store.delete(id);
        this.setState({ fav: next });
        window.dispatchEvent(new CustomEvent('ek-fav-change', { detail: { count: store.size } }));
      },
    };
  }
}
</script>
</body>
</html>
