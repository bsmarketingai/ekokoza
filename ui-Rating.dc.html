<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="{{ wrapStyle }}">
  <span style="display:inline-flex; gap:2px; color:#B8860B;">
    <sc-for list="{{ stars }}" as="s" hint-placeholder-count="5">
      <span style="{{ s.style }}"></span>
    </sc-for>
  </span>
  <sc-if value="{{ showCount }}" hint-placeholder-val="{{ true }}">
    <span style="font-size:12.5px; color:#8a8776;">({{ count }})</span>
  </sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:70},&quot;value&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:4.5,&quot;min&quot;:0,&quot;max&quot;:5,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:128,&quot;min&quot;:0,&quot;max&quot;:9999,&quot;tsType&quot;:&quot;number&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:14,&quot;min&quot;:10,&quot;max&quot;:28,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  mask(name, size) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    return `display:inline-block; width:${size}px; height:${size}px; flex:0 0 auto; background-color:currentColor; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`;
  }
  renderVals() {
    const value = Number(this.props.value ?? 4.5);
    const count = Number(this.props.count ?? 0);
    const size = Number(this.props.size ?? 14);
    // reserve the row's height even with no reviews, so cards stay equal height
    const empty = count === 0;

    const stars = [0, 1, 2, 3, 4].map(i => {
      if (empty) return { style: this.mask('star', size) + ' opacity:.28;' };
      const filled = value - i;
      const name = filled >= 0.75 ? 'star-filled' : (filled >= 0.25 ? 'star-half' : 'star');
      return { style: this.mask(name, size) };
    });

    return {
      stars,
      count: count.toLocaleString('cs-CZ'),
      showCount: !empty,
      wrapStyle: "display:inline-flex; align-items:center; gap:7px; min-height:" + (size + 4) + "px; font-family:'Hanken Grotesk',sans-serif;" + (empty ? ' opacity:.55;' : ''),
    };
  }
}
</script>
</body>
</html>
