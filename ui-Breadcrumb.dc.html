<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .ek-bc-l { background-image: linear-gradient(currentColor,currentColor); background-size: 0% 1.5px; background-repeat: no-repeat; background-position: 0 100%; transition: background-size .3s ease; }
  .ek-bc-l:hover { background-size: 100% 1.5px; }
  .ek-bc-h span { transition: background-color .2s; }
  .ek-bc-h:hover span { background-color: #B23803 !important; }
</style>
</helmet>
<nav aria-label="Kde se nacházíte" style="display:flex; align-items:center; flex-wrap:wrap; gap:8px; font-family:'Work Sans',sans-serif; font-size:13.5px; line-height:1.4; color:#6B6B5E;">
  <sc-for list="{{ crumbs }}" as="c" hint-placeholder-count="4">
    <span style="display:flex; align-items:center; gap:8px; min-width:0;">
      <sc-if value="{{ c.isHome }}" hint-placeholder-val="{{ false }}">
        <a href="{{ c.href }}" title="{{ c.label }}" aria-label="{{ c.label }}" class="ek-bc-h" style="display:flex; align-items:center;"><span style="{{ c.icon }}"></span></a>
      </sc-if>
      <sc-if value="{{ c.isLink }}" hint-placeholder-val="{{ true }}">
        <a href="{{ c.href }}" class="ek-bc-l" style="color:#4C653D; text-decoration:none;">{{ c.label }}</a>
      </sc-if>
      <sc-if value="{{ c.isLast }}" hint-placeholder-val="{{ false }}">
        <span style="color:#6B6B5E; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">{{ c.label }}</span>
      </sc-if>
      <sc-if value="{{ c.sep }}" hint-placeholder-val="{{ true }}">
        <span aria-hidden="true" style="opacity:.5;">›</span>
      </sc-if>
    </span>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:48},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label:string, href?:string}[]&quot;},&quot;homeIcon&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const items = this.props.items ?? [
      { label: 'Úvod', href: 'index.html' },
      { label: 'Produkty', href: '#' },
      { label: 'Zdravé potraviny', href: '#' },
      { label: 'Kyselina citronová' },
    ];
    return {
      crumbs: items.map((it, i) => {
        const last = i === items.length - 1;
        const home = i === 0 && !last && (this.props.homeIcon ?? true);
        return {
          label: it.label, href: it.href ?? '#',
          isHome: home, isLink: !last && !home, isLast: last, sep: !last,
          icon: 'display:inline-block; width:18px; height:18px; flex:0 0 auto; background-color:#4C653D; -webkit-mask:url("assets/icons/home-01.svg") center / contain no-repeat; mask:url("assets/icons/home-01.svg") center / contain no-repeat;',
        };
      }),
    };
  }
}
</script>
</body>
</html>
