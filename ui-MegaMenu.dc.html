<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div class="ek-mega" style="position:absolute; left:0; right:0; top:100%; background:#FFFFFF; border-bottom:1px solid #E4DAC6; box-shadow:0 34px 54px -34px rgba(45,58,46,.4); z-index:70; font-family:'Work Sans',sans-serif;">
  <div style="max-width:1624px; margin:0 auto; padding:34px 32px; display:grid; grid-template-columns:1fr; gap:44px;" class="ek-mega-inner">
    <div>
      <div style="display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:16px;">
        <h3 style="margin:0; font-family:'EB Garamond',serif; font-weight:500; font-size:22px; color:#4C653D;">{{ title }}</h3>
        <a href="{{ allHref }}" onClick="{{ onClose }}" class="ek-link-u" style="color:#D8763B; text-decoration:none; font-weight:600; font-size:14px;"><span style="display:inline-flex; align-items:center; gap:6px;">Zobrazit vše<span style="{{ iconArrow }}"></span></span></a>
      </div>
      <sc-if value="{{ isMM2 }}" hint-placeholder-val="{{ false }}">
      <div style="display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:26px 40px; align-items:start; max-height:calc(100vh - 220px); overflow-y:auto; padding:0 6px 0 10px; margin-left:-10px;">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="6">
          <div style="{{ g.boxStyle }}">
            <sc-if value="{{ g.hasImg }}" hint-placeholder-val="{{ false }}"><img src="{{ g.img }}" alt="" loading="lazy" style="width:48px; height:48px; flex:0 0 48px; object-fit:contain; background:#FFFFFF; border-radius:8px; padding:3px; box-sizing:border-box;"></sc-if>
            <div style="display:flex; flex-direction:column; gap:1px; min-width:0; flex:1;">
            <a href="{{ g.href }}" onClick="{{ onClose }}" class="ek-mega-link" style="display:flex; align-items:center; gap:10px; padding:6px 10px; margin-left:-10px; border-radius:8px; text-decoration:none; color:#4C653D; font-size:15.5px; font-weight:600; transition:background .15s, color .15s;">{{ g.name }}</a>
            <div style="{{ g.listStyle }}"><sc-for list="{{ g.children }}" as="c" hint-placeholder-count="3">
              <a href="{{ c.href }}" onClick="{{ onClose }}" class="ek-mega-link" style="display:block; padding:5px 10px; margin-left:-10px; border-radius:8px; text-decoration:none; color:#52524a; font-size:14px; line-height:1.35; transition:background .15s, color .15s;">{{ c.name }}</a>
            </sc-for></div>
            <sc-if value="{{ g.showAll }}" hint-placeholder-val="{{ false }}">
              <a href="{{ g.href }}" onClick="{{ onClose }}" class="ek-link-u" style="align-self:flex-start; margin-top:4px; color:#D8763B; text-decoration:none; font-weight:600; font-size:13.5px;"><span style="display:inline-flex; align-items:center; gap:6px;">Zobrazit vše<span style="{{ iconArrowSm }}"></span></span></a>
            </sc-if>
            </div>
          </div>
        </sc-for>
      </div>
      </sc-if>
      <sc-if value="{{ isMM1 }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:4px 24px;">
        <sc-for list="{{ links }}" as="m" hint-placeholder-count="8">
          <a href="{{ m.href }}" onClick="{{ onClose }}" class="ek-mega-link" style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px; border-radius:10px; text-decoration:none; color:#2A2A24; font-size:15px; font-weight:500; transition:background .15s, color .15s;"><span style="display:flex; align-items:center; gap:10px; min-width:0;"><span style="{{ m.iconStyle }}"></span><sc-if value="{{ m.hasImg }}" hint-placeholder-val="{{ false }}"><img src="{{ m.img }}" alt="" loading="lazy" style="width:48px; height:48px; flex:0 0 48px; object-fit:contain; background:#FFFFFF; border-radius:8px; padding:3px; box-sizing:border-box;"></sc-if><span style="min-width:0; text-wrap:pretty;">{{ m.name }}</span></span><span style="{{ iconChevron }}"></span></a>
        </sc-for>
      </div>
      </sc-if>
    </div>
    <!-- Topovaný produkt skrytý (09/2026) — pro znovuzobrazení vraťte sloupec 1fr 340px a showProd = true -->
    <sc-if value="{{ showProd }}" hint-placeholder-val="{{ false }}">
      <dc-import name="ui-MegaProductCard" title="{{ prodName }}" price="{{ prodPrice }}" img="{{ prodImg }}" rating="{{ prodRating }}" rating-count="{{ prodRatingCount }}" cta-variant="{{ prodCtaVariant }}" on-navigate="{{ onClose }}" hint-size="100%,360px"></dc-import>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:420},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Co chcete vyrábět?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;allHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;links&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{name:string,href:string}[]&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;prodName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Levandulové máslo, 100 g&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Topovaný produkt&quot;},&quot;prodPrice&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;189 Kč&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Topovaný produkt&quot;},&quot;prodImg&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/products/levandulove-maslo-100-g.jpg&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Topovaný produkt&quot;},&quot;prodRating&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:4.8,&quot;min&quot;:0,&quot;max&quot;:5,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Topovaný produkt&quot;},&quot;prodRatingCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:214,&quot;min&quot;:0,&quot;max&quot;:9999,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Topovaný produkt&quot;},&quot;prodCtaVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;koupit&quot;,&quot;varianta&quot;],&quot;default&quot;:&quot;koupit&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Topovaný produkt&quot;}}">
class Component extends DCLogic {
  static DEF = [
        { name: 'Kosmetika', href: '#' }, { name: 'Mýdla', href: '#' },
        { name: 'Svíčky', href: '#' }, { name: 'Parfémy', href: '#' },
        { name: 'Vlasová péče', href: '#' }, { name: 'Séra', href: '#' },
      ];
  mask(name, size, color) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    return `display:inline-block; width:${size}px; height:${size}px; flex:0 0 auto; background-color:${color || 'currentColor'}; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`;
  }
  renderVals() {
    return {
      title: this.props.title ?? 'Co chcete vyrábět?',
      allHref: this.props.allHref ?? '#',
      links: (this.props.links ?? Component.DEF).map(m => Object.assign({}, m, { hasImg: !!m.img, iconStyle: (m.icon && !m.img) ? this.mask(m.icon, 20, '#4F6E2A') : 'display:none;' })),

      onClose: this.props.onClose ?? (() => {}),
      isMM2: (this.props.variant === 'mm2' || this.props.variant === 'mm3') && Array.isArray(this.props.groups),
      isMM1: !((this.props.variant === 'mm2' || this.props.variant === 'mm3') && Array.isArray(this.props.groups)),
      groups: (this.props.groups || []).map(g => {
        const lim = this.props.variant === 'mm3';
        const kids = g.children || [];
        const shown = lim ? kids.slice(0, 5) : kids;
        const wide = shown.length > 10;
        return Object.assign({}, g, { children: shown, showAll: lim && kids.length > 0,
          hasImg: !!g.img, boxStyle: 'display:flex; align-items:flex-start; gap:14px; min-width:0;' + (wide ? ' grid-column:span 2; grid-row:span 3;' : ''),
          listStyle: wide ? 'display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); column-gap:24px;' : 'display:flex; flex-direction:column; gap:1px;' });
      }),
      iconArrowSm: this.mask('arrow-right-02', 16),
      showProd: false,
      prodName: this.props.prodName ?? 'Levandulové máslo, 100 g',
      prodPrice: this.props.prodPrice ?? '189 Kč',
      prodImg: this.props.prodImg ?? 'assets/products/levandulove-maslo-100-g.jpg',
      prodRating: this.props.prodRating ?? 4.8,
      prodRatingCount: this.props.prodRatingCount ?? 214,
      prodCtaVariant: this.props.prodCtaVariant ?? 'koupit',
      iconArrow: this.mask('arrow-right-02', 20),
      iconChevron: this.mask('arrow-right-01', 15, '#c9c2ae'),
    };
  }
}
</script>
</body>
</html>
