<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .ek-var { border: 1.5px solid #E2D9C4; background: #fff; border-radius: 12px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 14px; width: 100%; cursor: pointer; text-align: left; transition: border-color .2s, background .2s, box-shadow .2s; }
  .ek-var:hover { border-color: #4C643C; background: #FDFBF5; }
  .ek-var-on { border-color: #4C643C !important; background: #F4F7EA !important; box-shadow: 0 0 0 2px rgba(76,100,60,.16); }
  .ek-var-more { border: none; background: transparent; color: #3B5531; font-family: 'Hanken Grotesk',sans-serif; font-size: 14.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 7px; padding: 4px 0; align-self: flex-start; }
  .ek-var-more:hover { color: #B23803; }
</style>
</helmet>
<div style="display:flex; flex-direction:column; gap:11px; font-family:'Hanken Grotesk',sans-serif;">
  <sc-if value="{{ hasHeading }}" hint-placeholder-val="{{ true }}">
    <span style="font-size:13px; letter-spacing:.12em; text-transform:uppercase; font-weight:700; color:#4F6E2A;">{{ heading }}</span>
  </sc-if>
  <div style="display:flex; flex-direction:column; gap:8px;">
    <sc-for list="{{ rows }}" as="v" hint-placeholder-count="3">
      <button onClick="{{ v.select }}" class="{{ v.cls }}">
        <span style="display:flex; flex-direction:column; gap:5px; align-items:flex-start; min-width:0;">
          <span style="{{ v.labelStyle }}">{{ v.label }}</span>
          <dc-import name="ui-Stock" state="{{ v.state }}" date="{{ v.date }}" size="{{ 12.5 }}" hint-size="150px,18px"></dc-import>
        </span>
        <span style="display:flex; align-items:center; gap:12px; flex:0 0 auto;">
          <span style="{{ v.priceStyle }}">{{ v.price }}</span>
          <span style="{{ v.tick }}"></span>
        </span>
      </button>
    </sc-for>
  </div>
  <sc-if value="{{ hasMore }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ toggle }}" class="ek-var-more">{{ moreLabel }}<span style="{{ moreIcon }}"></span></button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:300},&quot;variants&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label:string, price:string, state?:string, date?:string}[]&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:20,&quot;tsType&quot;:&quot;number&quot;},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Vyberte variantu&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;maxVisible&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;min&quot;:2,&quot;max&quot;:12,&quot;tsType&quot;:&quot;number&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(i:number, v:object)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { open: false, sel: null };

  mask(name, size, color) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    return `display:inline-block; width:${size}px; height:${size}px; flex:0 0 auto; background-color:${color}; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`;
  }

  renderVals() {
    const variants = this.props.variants ?? [
      { label: '1 kg', price: '110 Kč', state: 'ready' },
      { label: '5 kg', price: '450 Kč', state: 'ready' },
      { label: '25 kg', price: '1 700 Kč', state: 'packing' },
    ];
    const sel = this.state.sel ?? Number(this.props.selected ?? 0);
    const maxVisible = Number(this.props.maxVisible ?? 4);
    const hasMore = variants.length > maxVisible;
    const open = this.state.open;
    const shown = hasMore && !open ? variants.slice(0, maxVisible) : variants;

    return {
      heading: this.props.heading ?? 'Vyberte variantu',
      hasHeading: (this.props.heading ?? 'Vyberte variantu') !== '',
      hasMore,
      toggle: () => this.setState({ open: !open }),
      moreLabel: open ? 'Méně variant' : 'Více variant (' + (variants.length - maxVisible) + ')',
      moreIcon: this.mask(open ? 'arrow-up-01' : 'arrow-down-01', 24, 'currentColor'),
      rows: shown.map((v, i) => {
        const on = i === sel;
        return {
          label: v.label,
          price: v.price,
          state: v.state ?? 'ready',
          date: v.date ?? '',
          cls: on ? 'ek-var ek-var-on' : 'ek-var',
          labelStyle: 'font-size:16px; font-weight:' + (on ? '700' : '600') + '; color:#2A2A24;',
          priceStyle: "font-family:'Spectral',serif; font-size:18px; font-weight:500; color:#3B5531; white-space:nowrap;",
          tick: on
            ? this.mask('checkmark-circle-01', 24, '#4C643C')
            : 'display:inline-block; width:24px; height:24px; flex:0 0 auto; border-radius:50%; border:1.5px solid #D8CDB4;',
          select: () => {
            this.setState({ sel: i });
            if (this.props.onSelect) this.props.onSelect(i, v);
          },
        };
      }),
    };
  }
}
</script>
</body>
</html>
